# greeksoup.ai is whatever docs/ holds. GitLab Pages publishes it on every push to main
# that changes docs/ (no build step: scripts/build_docs.py and build_site.py already wrote
# the files). Pages deploys cost nothing per deploy; the job takes well under a minute.
# The first two pipelines failed before any job ran: GitLab.com runs shared runners only
# for a verified account (a one-time phone check), done 2026-09-17.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - rm -rf public && cp -r docs public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docs/**/*
        - .gitlab-ci.yml
