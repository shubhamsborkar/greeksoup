<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes · GreekSoup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='24' fill='%230F1114'/><path d='M22 38l16 22-16 22' stroke='%23ED5A24' stroke-width='12' stroke-linecap='square' stroke-linejoin='miter' fill='none'/><rect x='48' y='66' width='12' height='20' fill='%23ECEBE6'/><rect x='66' y='50' width='12' height='36' fill='%23ECEBE6'/><rect x='84' y='34' width='12' height='52' fill='%23ECEBE6'/></svg>">
<link rel="stylesheet" href="/assets/desk.css">
<script src="/assets/desk.js" defer></script>
<script src="/assets/blocks.js" defer></script>
<style>
main{max-width:1220px;margin:0 auto;padding:18px 22px}
/* the top line: what the vault is, and the two ways in */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top .q{flex:1 1 360px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:0 12px}
.top .q svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.6;flex:0 0 auto}
.top .q input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;padding:10px 0;outline:none;min-width:0}
.top .q input::placeholder{color:var(--muted)}
.top button{border-radius:9px;padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.top button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.top button:hover{border-color:var(--ink2)} .top button.pri:hover{border-color:var(--accent);filter:brightness(1.06)}
.lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
/* the index of the vault: what is in it, by name, project and subject */
.rail{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:4px}
.rail h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;padding:14px 0 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.rail h3 span{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.rail h3:first-child{padding-top:2px}
.rail .r{display:flex;align-items:baseline;gap:8px;padding:6px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;font-size:12.5px;border-radius:0}
.rail .r:hover,.rail .r.on{background:var(--panel2)}
.rail .r .sy{font-family:Menlo,monospace;font-weight:700;flex:0 0 auto}
.rail .r .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .r .st{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;flex:0 0 auto}
.rail .r .n{font-family:Menlo,monospace;font-size:11px;color:var(--muted);flex:0 0 auto}
.rail .r .n b{color:var(--neg);font-weight:700}
.rail .r.loose .nm{color:var(--ink2);font-style:italic}
.rail .none{padding:8px 6px;font-size:11.5px;color:var(--muted);line-height:1.5}
.rail .more{display:block;padding:6px;font-size:11px;color:var(--accent);cursor:pointer}
/* the right side: the table of notes, or one note, or the editor */
.pane{min-width:0}
.bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.bar h2{font-size:15px;margin:0;color:var(--ink)}
.bar .cnt{font-size:11.5px;color:var(--muted)}
.bar select{margin-left:auto;background:var(--panel);color:var(--ink2);border:1px solid var(--line2);border-radius:7px;padding:4px 8px;font:inherit;font-size:11.5px}
.bar select+select{margin-left:0}
.bar select.on{color:var(--ink);border-color:var(--ink2)}
.bar a.back{font-size:12px;color:var(--accent);text-decoration:none;margin-right:auto}
table.nt{width:100%;border-collapse:collapse;font-size:13px}
.nt th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.nt td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.nt tr:hover td{background:var(--panel2)}
.nt tr{cursor:pointer}
.nt .d{font-family:Menlo,monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
.nt .ty{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;white-space:nowrap}
.nt .t b{font-weight:600;color:var(--ink)} .nt .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
.nt .t small i{color:var(--accent);font-style:normal}
.nt .w{font-size:11.5px;color:var(--ink2);white-space:nowrap} .nt .w .sy{font-family:Menlo,monospace;font-weight:700;margin-right:6px}
.nt .w .per{color:var(--muted)} .nt .fx{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.nt .fx.miss{color:var(--neg)}
.empty{padding:26px 0;color:var(--muted);font-size:12.5px;line-height:1.6}
.empty b{color:var(--ink2)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6;padding:16px 0 0}
.foot b{color:var(--ink2);font-weight:600}
/* the editor */
.ed{padding:0;display:flex;flex-direction:column;gap:10px}
.ed .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed input,.ed select,.ed textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.ed input.title{flex:1 1 320px;font-size:18px;font-weight:600;padding:9px 12px}
.ed select{min-width:120px}
.ed textarea{width:100%;min-height:340px;font-family:Menlo,monospace;font-size:12.5px;line-height:1.55;resize:vertical}
.ed .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);min-width:70px}
.ed button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:12.5px;font-family:inherit}
.ed button.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line2)}
.ed button.danger{background:none;color:var(--neg);border:1px solid var(--line2)}
.ed .msg{font-size:11.5px;color:var(--muted)}
.ed.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.ed .bkchip{background:var(--panel);color:var(--ink2);border:1px solid var(--line2);font-weight:600;font-size:11px;padding:4px 9px}
.chip{font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap;font-family:inherit}
.chip.sym{font-family:Menlo,monospace;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .chip .x{margin-left:6px;opacity:.7}
.fchip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px 10px}
.fchip .x{cursor:pointer;opacity:.7} .fchip .x:hover{opacity:1;color:var(--neg)}
.fcard{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}
.fcard .fi{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fcard .fn{flex:1 1 auto;min-width:0} .fcard .fn b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .fcard .fn small{color:var(--muted);font-size:11px}
.fcard a.op{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:6px 12px;text-decoration:none}
.fcard button{background:none;color:var(--ink2);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.fcard.miss{border-color:var(--neg)} .fcard.miss .fi{background:var(--neg)}
.ftext{font-size:11.5px;color:var(--muted);margin:-8px 0 14px;line-height:1.5}
.ftext b{color:var(--ink2);font-weight:600}
.fimg{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:0 0 14px;display:block}
.ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.ask button{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.ask button.danger{color:var(--neg)}
/* journal, tasks, timeline */
.jday{margin:0 0 18px} .jday h3{font-size:12px;color:var(--ink2);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline} .jday h3 small{font-family:Menlo,monospace;color:var(--muted);font-weight:400;font-size:10.5px}
.je{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:baseline}
.je .t{font-family:Menlo,monospace;color:var(--muted);font-size:11px}
.je .sy{font-family:Menlo,monospace;font-weight:700;color:var(--ink2);margin-right:6px}
.je .why{display:block;color:var(--ink2);font-size:12px;margin-top:3px;padding-left:10px;border-left:2px solid var(--line2)}
.je .addwhy{display:inline-block;color:var(--muted);font-size:11px;cursor:pointer;margin:3px 0 0 8px} .je .addwhy:hover{color:var(--accent)}
.je input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font:inherit;font-size:12px;margin-top:4px}
.jpend{border-left:2px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 14px}
.jpend .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.tk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.tk input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
.tk .m{font-size:10.5px;color:var(--muted);margin-left:8px} .tk .m .sy{font-family:Menlo,monospace;font-weight:700;color:var(--ink2)}
.tk .m .due{color:var(--ink2)} .tk.over .m .due{color:var(--neg);font-weight:700}
.tk .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px} .tk .x:hover{color:var(--neg)}
.tk.done .t{color:var(--muted);text-decoration:line-through}
.tb{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 4px} .tb.over{color:var(--neg)} .tb.today{color:var(--accent)}
.tadd{display:grid;grid-template-columns:1fr 130px 140px 120px auto;gap:6px;margin:0 0 12px}
.tadd input,.tadd select{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;min-width:0}
.tadd button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
@media(max-width:1100px){.tadd{grid-template-columns:1fr 1fr}}
.jown{display:flex;gap:8px;margin:0 0 16px} .jown input{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px}
.jown button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.ed .msg.ok{color:var(--pos)} .ed .msg.err{color:var(--neg)}
.symwrap{position:relative;display:inline-block}
.sugg{position:absolute;left:0;top:calc(100% + 4px);z-index:20;min-width:340px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);overflow:hidden;display:none}
.sugg.on{display:block}
.sugg button{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 12px;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;border-radius:0;font-weight:400}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:var(--panel2)}
.sugg .sy{font-family:Menlo,monospace;font-weight:700}
.sugg .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.sugg .e{color:var(--muted);font-size:10.5px}
/* one note */
.view{padding:0}
.view h1{font-size:22px;margin:0 0 6px}
.view .meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.view .meta .ty{color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.md{font-size:13.5px;line-height:1.65;color:var(--ink);max-width:860px}
.md h1,.md h2,.md h3{margin:16px 0 6px;font-size:15px}
.md h2{font-size:14px} .md h3{font-size:13px}
.md p{margin:0 0 10px} .md ul,.md ol{margin:0 0 10px 20px}
.md code{font-family:Menlo,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.md a{color:var(--accent);text-decoration:none} .md a.wl{border-bottom:1px dashed var(--accent)}
.md a.sy{font-family:Menlo,monospace;font-weight:700}
.md blockquote{margin:0 0 10px;padding:4px 12px;border-left:2px solid var(--line2);color:var(--ink2)}
.md pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;overflow:auto;font-family:Menlo,monospace;font-size:12px;line-height:1.5}
.bk{border:1px solid var(--line2);border-radius:10px;background:var(--panel);margin:0 0 12px;overflow:hidden}
.bk .bk-spec{font-size:10.5px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em}
.bk .bk-body{padding:10px 12px;font-size:12.5px} .bk .bk-err{color:var(--neg);font-size:12px}
.bk .muted{color:var(--muted)} .bk .pos{color:var(--pos)} .bk .neg{color:var(--neg)} .bk .r{text-align:right}
.bk a{color:var(--ink);text-decoration:none} .bk a:hover{color:var(--accent)}
.bk .bk-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px} .bk .bk-h b{font-size:14px}
.bk .bk-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:2px 0 6px}
.bk .bk-t{width:100%;border-collapse:collapse;font-size:12.5px} .bk .bk-t th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:2px 6px 6px 0;font-weight:600} .bk .bk-t td{padding:4px 6px 4px 0;border-top:1px solid var(--line)}
.bk .bk-list{display:flex;flex-direction:column;gap:4px} .bk .bk-list>*{display:flex;gap:8px;align-items:baseline}
.bk .bk-list .r{margin-left:auto} .bk .ty{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.bk .bk-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 20px;font-size:12px}
.bk-spark{width:100%;height:110px;display:block;margin-top:4px}
.conn{padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.conn .g .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.conn a{display:inline-block;font-size:11.5px;color:var(--ink2);margin:0 8px 6px 0;text-decoration:none}
.conn a:hover{color:var(--accent)}
.conn a.sy{font-family:Menlo,monospace;font-weight:700}
.view .btns{display:flex;gap:8px;margin-top:14px}
.view .btns button{background:var(--panel);color:var(--ink2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.view .btns button.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.tl-g{margin:0 0 14px} .tl-g .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 4px}
.tl-r{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.tl-r .d{font-family:Menlo,monospace;color:var(--muted);font-size:11.5px;flex:0 0 auto} .tl-r .ty{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;flex:0 0 52px}
.tl-r a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tl-r a:hover{color:var(--accent)}
.tl-r .fx{font-size:10px;color:var(--muted);margin-left:auto;flex:0 0 auto}
@media (max-width:900px){.lay{grid-template-columns:1fr}.rail{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <div class="brand">RESEARCH <span>DESK</span></div>
  <nav></nav>
  <div class="right"><span id="asof"></span></div>
</header>
<main>
  <div class="top">
    <label class="q"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" placeholder="Search every note, and inside every file you brought in" autocomplete="off"></label>
    <button id="attachbtn" title="An annual report, a model, a screenshot: it becomes a note with the file attached, and the desk reads what is inside">Bring a file in</button>
    <button class="pri" id="newbtn">New note</button>
  </div>
  <div class="lay">
    <div class="rail" id="rail"><div class="none">Loading the vault…</div></div>
    <div class="pane" id="pane">
      <div id="home">
        <div class="bar"><h2 id="h_title">Every note</h2><span class="cnt" id="cnt"></span>
          <select id="f_type"><option value="">any type</option></select>
          <select id="f_kind"><option value="">about anything</option></select>
          <select id="f_status"><option value="">any status</option></select>
          <select id="period"><option value="">any period</option></select></div>
        <div id="list"><div class="empty">Loading…</div></div>
        <div class="foot" id="foot"></div>
      </div>
      <div id="view" style="display:none"></div>
      <div class="ed" id="ed" style="display:none">
        <div class="row"><a class="back" id="e_back" href="/notes" style="font-size:12px;color:var(--accent);text-decoration:none">← every note</a></div>
        <div class="row"><input class="title" id="e_title" placeholder="Title" autocomplete="off">
          <select id="e_type" title="what sort of note"></select>
          <label class="chip" style="cursor:pointer"><input type="checkbox" id="e_pin" style="vertical-align:-2px;margin-right:5px">pinned</label></div>
        <div class="row"><span class="lbl">About</span><select id="e_kind" title="what the note is about"></select>
          <input id="e_about" placeholder="which commodity" style="width:220px;display:none" autocomplete="off" list="aboutlist"><datalist id="aboutlist"></datalist>
          <span class="lbl" style="margin-left:8px">Period</span><input id="e_period" list="periodlist" placeholder="Q2 FY26" style="width:110px" autocomplete="off"><datalist id="periodlist"></datalist></div>
        <div class="row" id="e_symrow"><span class="lbl">Names</span><span class="chips" id="e_syms"></span>
          <span class="symwrap"><input id="e_symin" placeholder="company name or symbol" autocomplete="off" style="width:220px"><div class="sugg" id="sugg"></div></span></div>
        <div class="row"><span class="lbl">Project</span><input id="e_project" list="projlist" placeholder="a project note's title, or leave empty" style="width:280px" autocomplete="off"><datalist id="projlist"></datalist>
          <span class="lbl" style="margin-left:8px">Tags</span><input id="e_tags" placeholder="comma, separated" style="width:200px" autocomplete="off"></div>
        <div class="row"><span class="lbl">File</span><span id="e_file"></span><button class="ghost" id="e_attach" type="button">Attach a file</button><input type="file" id="e_fileinput" style="display:none"><span class="msg">An annual report, a model, a screenshot. It goes into the vault when you save the note, and nowhere else.</span></div>
        <textarea id="e_body" placeholder="The note, in Markdown. [[Another note]] links by title. $AAPL names a listing anywhere in the text. A live block: three backticks then desk on one line, chart AAPL 1y on the next, three backticks to close."></textarea>
        <div class="row" style="gap:6px;flex-wrap:wrap"><span class="lbl">Live blocks</span><span class="msg">the desk's own numbers, drawn on the note's page and kept current:</span><span id="bkchips"></span></div>
        <div class="row"><button id="e_save">Save</button><button class="ghost" id="e_cancel">Cancel</button><span style="flex:1"></span><button class="danger" id="e_del" style="display:none">Delete this note</button></div>
        <div class="msg" id="e_msg"></div>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
let TYPES=[], KINDS=[], FACETS={periods:[],abouts:[]}, NOTES=[], CUR=null, EDIT={syms:[]};
let F={type:"", kind:P.get("kind")||"", period:P.get("period")||"", about:P.get("about")||"", symbol:P.get("symbol")||"", project:P.get("project")||"", status:P.get("status")||"", q:""};
const STATUS_LABEL={watchlist:"Watchlist",researching:"Researching","thesis built":"Thesis built",invested:"Invested",exited:"Exited"};
const TYPE_LABEL={general:"Note",news:"News",insight:"Insight",concall:"Call",meeting:"Meeting",risk:"Risk",answer:"AI answer",document:"Document",model:"Model",clipping:"Clipping",decision:"Decision",exit:"Exit",project:"Project"};
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":b>=1024?Math.round(b/1024)+" KB":b+" B";
const fileUrl=rel=>"/api/research/file?path="+encodeURIComponent(rel);
const fileExt=rel=>(rel.split(".").pop()||"").toUpperCase().slice(0,5);
function textLine(t){
  if(!t) return "";
  if(t.state==="reading") return "Reading the file… search will find what is inside it, and the Ask box will read it, in a moment.";
  if(t.state==="failed") return `The desk could not read the text in this file (${esc(t.error||"")}). It is kept and opens as it is; search and the Ask box do not see inside it.`;
  if(t.state==="none") return "This kind of file has no text the desk can read. It is kept and opens as it is.";
  if(t.state==="ready") return `<b>${t.pages?t.pages+" pages · ":""}${Math.round(t.chars/1000)}k characters read.</b> Search finds what is inside it, and the Ask box on this name reads it.`;
  return "";
}
const KIND_LABEL={stock:"Stock",commodity:"Commodity",sector:"Sector",macro:"Macro",general:"General"};
const ABOUT_HINT={commodity:"which commodity, e.g. rubber",sector:"which sector, e.g. Gulf delivery",macro:"which theme, e.g. US rates",general:"a subject, or leave empty"};
const subj=n=>n.kind==="stock"?"":(n.about?`${KIND_LABEL[n.kind]||n.kind} · ${n.about}`:(KIND_LABEL[n.kind]||n.kind));

/* ---- a small Markdown renderer: headings, lists, bold, italics, code, links, [[notes]], $SYMBOLS ---- */
function md(src){
  const lines=src.split("\n"); let out="", inList=null, para=[];
  const inline=t=>esc(t)
    .replace(/\[\[([^\]|#]+)(?:[|#]([^\]]*))?\]\]/g,(m,a,b)=>{ const n=NOTES.find(x=>x.title.toLowerCase()===a.trim().toLowerCase()); return n?`<a class="wl" href="/notes?id=${encodeURIComponent(n.id)}" data-id="${esc(n.id)}">${esc(b||a)}</a>`:`<span class="wl" style="color:var(--muted)">${esc(b||a)}</span>`; })
    .replace(/(^|[^\w$])\$([A-Z][A-Z0-9]{0,9}(?:[.\-][A-Z0-9]{1,6})?)\b/g,(m,pre,s)=>`${pre}<a class="sy" href="/t?symbol=${encodeURIComponent(s)}">$${s}</a>`)
    .replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush=()=>{ if(para.length){out+=`<p>${inline(para.join(" "))}</p>`;para=[];} if(inList){out+=`</${inList}>`;inList=null;} };
  let fence=null, fbuf=[];
  for(const raw of lines){
    const l=raw.replace(/\s+$/,"");
    let m;
    if(fence!==null){ if(/^```\s*$/.test(l)){ if(fence==="desk"){ fbuf.filter(x=>x.trim()).forEach(spec=>{ out+=`<div data-desk-block="${esc(spec.trim())}"></div>`; }); } else out+=`<pre>${esc(fbuf.join("\n"))}</pre>`; fence=null; fbuf=[]; } else fbuf.push(raw); continue; }
    if((m=l.match(/^```\s*(\w*)\s*$/))){ flush(); fence=m[1].toLowerCase(); fbuf=[]; continue; }
    if(!l.trim()){flush();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)/))){flush();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;continue;}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){ if(para.length){out+=`<p>${inline(para.join(" "))}</p>`;para=[];} if(inList!=="ul"){if(inList)out+=`</${inList}>`;out+="<ul>";inList="ul";} out+=`<li>${inline(m[1])}</li>`;continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(para.length){out+=`<p>${inline(para.join(" "))}</p>`;para=[];} if(inList!=="ol"){if(inList)out+=`</${inList}>`;out+="<ol>";inList="ol";} out+=`<li>${inline(m[1])}</li>`;continue;}
    if((m=l.match(/^>\s?(.*)/))){flush();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue;}
    if(inList){out+=`</${inList}>`;inList=null;}
    para.push(l);
  }
  flush(); if(fence!==null) out+=`<pre>${esc(fbuf.join("\n"))}</pre>`; return out;
}

async function post(url,body){ const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}); return r.json(); }
function say(t,k){ const e=$("e_msg"); e.textContent=t; e.className="msg "+(k||""); }

/* the pane shows one thing at a time: the table, a note, the editor, tasks, the journal or a name's timeline */
function pane(which){ $("home").style.display=which==="home"?"":"none"; $("view").style.display=which==="view"?"":"none"; $("ed").style.display=which==="ed"?"flex":"none"; }
const backLink=`<a class="back" href="/notes" data-home="1" style="display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;margin-bottom:10px">← every note</a>`;
function wireBack(){ document.querySelectorAll("a[data-home]").forEach(a=>a.onclick=e=>{e.preventDefault(); goHome();}); }
function goHome(){ CUR=null; F.symbol=""; F.project=""; F.about=""; F.kind=F.kind||""; history.replaceState(null,"","/notes"); pane("home"); load(); markRail(""); }
function markRail(key){ document.querySelectorAll("#rail .r").forEach(r=>r.classList.toggle("on",!!key&&r.dataset.key===key)); }
function sel(id,val,opts,first){ const s=$(id); s.innerHTML=`<option value="">${first}</option>`+opts.map(([v,l])=>`<option value="${esc(v)}"${val===v?" selected":""}>${esc(l)}</option>`).join(""); s.classList.toggle("on",!!val); }

async function load(){
  const qs=new URLSearchParams(); for(const k of ["type","kind","period","about","symbol","project","status","q"]) if(F[k]) qs.set(k,F[k]);
  const r=await fetch("/api/notes?"+qs); const d=await r.json();
  TYPES=d.types||[]; KINDS=d.kinds||[]; FACETS=d.facets||FACETS; NOTES=d.notes||[];
  $("asof").textContent=(d.folder||"data/research").replace(/^\/Users\/[^/]+|^\/home\/[^/]+|^[A-Z]:\\Users\\[^\\]+/,"~");
  sel("f_type",F.type,TYPES.map(t=>[t,TYPE_LABEL[t]||t]),"any type");
  sel("f_kind",F.kind,KINDS.map(t=>[t,"about a "+(KIND_LABEL[t]||t).toLowerCase()]),"about anything");
  sel("f_status",F.status,(d.statuses||[]).map(t=>[t,STATUS_LABEL[t]||t]),"any status");
  const ps=FACETS.periods||[]; if(F.period&&!ps.includes(F.period)) ps.unshift(F.period);
  sel("period",F.period,ps.map(p=>[p,p]),"any period");
  $("periodlist").innerHTML=ps.map(p=>`<option value="${esc(p)}">`).join("");
  const what=F.project?`In ${F.project}`:F.about?`${KIND_LABEL[F.kind]||"About"} · ${F.about}`:F.q?`Search: ${F.q}`:"Every note";
  $("h_title").textContent=what;
  $("cnt").textContent=`${NOTES.length} note${NOTES.length===1?"":"s"}`;
  if(!NOTES.length){ $("list").innerHTML=`<div class="empty">${F.q?"Nothing matches, in the notes or inside their files.":F.symbol||F.project||F.type||F.kind||F.period||F.about||F.status?"No notes match.":"No notes yet. <b>New note</b> writes the first; <b>Bring a file in</b> starts one from an annual report, a model or a screenshot."}</div>`; }
  else $("list").innerHTML=`<table class="nt"><thead><tr><th>Updated</th><th>Type</th><th>Note</th><th>Where it belongs</th><th></th></tr></thead><tbody>`+NOTES.map(n=>`<tr data-id="${esc(n.id)}">
      <td class="d">${esc(n.updated.slice(0,10))}</td><td class="ty">${TYPE_LABEL[n.type]||n.type}</td>
      <td class="t"><b>${esc(n.title)}</b>${n.pinned?' <span class="ty" style="color:var(--muted)">pinned</span>':""}${n.example?' <span class="ty" style="color:var(--muted)">example</span>':""}<small>${n.hit==="file"?"<i>in the file · </i>":""}${esc(n.snippet||"")}</small></td>
      <td class="w">${n.symbols.slice(0,4).map(s=>`<span class="sy">$${esc(s)}</span>`).join("")}${subj(n)?`<span>${esc(subj(n))}</span> `:""}${n.period?`<span class="per"> ${esc(n.period)}</span>`:""}${n.project?`<span class="per"> · in ${esc(n.project)}</span>`:""}</td>
      <td class="fx${n.file&&!n.file_ok?" miss":""}">${n.file?(n.file_ok?fileExt(n.file):"file missing"):""}</td></tr>`).join("")+`</tbody></table>`;
  $("list").querySelectorAll("tr[data-id]").forEach(a=>a.onclick=()=>open(a.dataset.id));
  const loose=d.loose||[];
  $("foot").innerHTML=(loose.length?`<div style="margin-bottom:10px"><b>${loose.length} file${loose.length===1?"":"s"} in the vault on no note yet:</b> ${loose.map(f=>`<a href="/notes?new&file=${encodeURIComponent(f.file)}${f.subject&&/^[A-Z0-9.\-]+$/.test(f.subject)?"&symbol="+encodeURIComponent(f.subject):""}" style="color:var(--accent);text-decoration:none">${esc(f.name)}</a> (${fmtSize(f.size)}, give it a note)`).join(" · ")}</div>`:"")+
    `<b>What this is.</b> Every note and every file you bring in is a plain file in the desk's own research folder, and the folder is yours: open it in Obsidian or any editor and the same files are there; your AI agent reads and writes them too. A note says what it is about (a listing, a commodity, a sector, a theme), the quarter it is researching and the project it belongs to, and links to other notes with [[double brackets]]. The index on the left is the same vault by name, project and subject; a name's line opens its timeline, twelve months back and more. Nothing is saved here unless you save it.`;
  try{ const g=await (await fetch("/api/notes/graph")).json();
    $("projlist").innerHTML=(g.nodes||[]).filter(n=>n.kind==="project").map(n=>`<option value="${esc(n.label)}">`).join("");
    $("aboutlist").innerHTML=(FACETS.abouts||[]).map(a=>`<option value="${esc(a.about)}">`).join("");
  }catch(e){}
  loadRail();
}
$("q").addEventListener("input",()=>{clearTimeout(window._qt);window._qt=setTimeout(()=>{F.q=$("q").value.trim(); if(F.q){ CUR=null; F.symbol=""; pane("home"); } load();},200);});
$("period").addEventListener("change",()=>{F.period=$("period").value;load();});
$("f_type").addEventListener("change",()=>{F.type=$("f_type").value;load();});
$("f_kind").addEventListener("change",()=>{F.kind=$("f_kind").value;F.about="";load();});
$("f_status").addEventListener("change",()=>{F.status=$("f_status").value;load();});

/* the index on the left: the vault by name, project and subject, plus what is due and what the desk saw */
async function loadRail(){
  let t; try{ t=await (await fetch("/api/research/tree")).json(); }catch(e){ return; }
  const c=t.counts||{}, tk=t.tasks||{}, jd=t.journal||[];
  const row=(key,inner,cls)=>`<a class="r${cls?" "+cls:""}" data-key="${esc(key)}">${inner}</a>`;
  let h=`<h3>The desk<span>${c.notes||0} note${c.notes===1?"":"s"} · ${c.files||0} file${c.files===1?"":"s"}</span></h3>`+
    row("tasks",`<span class="nm">Tasks</span><span class="n">${tk.open||0} open${tk.due?` · <b>${tk.due} due</b>`:""}</span>`)+
    row("journal",`<span class="nm">Journal</span><span class="n">${jd.length} day${jd.length===1?"":"s"}</span>`);
  h+=`<h3>Names<span>${c.names||0}</span></h3>`+((t.names||[]).map(r=>row("n:"+r.symbol,`<span class="sy">$${esc(r.symbol)}</span>${r.status?`<span class="st">${esc(STATUS_LABEL[r.status]||r.status)}</span>`:""}<span class="nm"></span><span class="n">${r.notes.length+r.loose.length}</span>`)).join("")||`<div class="none">No note names a listing yet. A name on a note, or a file dropped on a listing's page, starts its folder here.</div>`);
  if((t.projects||[]).length) h+=`<h3>Projects<span>${t.projects.length}</span></h3>`+t.projects.map(p=>row("p:"+p.title,`<span class="nm">${esc(p.title)}</span><span class="n">${(p.symbols||[]).length} names</span>`)).join("");
  for(const g of (t.subjects||[])) h+=`<h3>${esc((KIND_LABEL[g.kind]||g.kind)+(g.rows.length===1?"":"s"))}<span>${g.rows.length}</span></h3>`+g.rows.map(r=>row("s:"+g.kind+":"+r.about,`<span class="nm">${esc(r.about)}</span><span class="n">${r.notes.length+r.loose.length}</span>`)).join("");
  if((t.general||[]).length) h+=`<h3>General<span>${t.general.length}</span></h3>`+t.general.slice(0,8).map(L=>row("id:"+L.id,`<span class="nm">${esc(L.title)}</span><span class="n">${esc(L.updated.slice(0,10))}</span>`)).join("");
  if((t.loose_other||[]).length) h+=`<h3>Files on no note yet<span>${t.loose_other.length}</span></h3>`+t.loose_other.map(f=>row("f:"+f.file,`<span class="nm">${esc(f.name)}</span><span class="n">${fmtSize(f.size)}</span>`,"loose")).join("");
  $("rail").innerHTML=h;
  $("rail").querySelectorAll(".r").forEach(a=>a.onclick=e=>{ e.preventDefault(); const k=a.dataset.key;
    if(k==="tasks") return showTasks();
    if(k==="journal") return showJournal();
    if(k.startsWith("n:")){ const sy=k.slice(2); CUR=null; F.symbol=sy; F.project=""; F.about=""; markRail(k); return showTimeline(sy); }
    if(k.startsWith("p:")){ CUR=null; F.symbol=""; F.project=k.slice(2); F.about=""; markRail(k); pane("home"); return load(); }
    if(k.startsWith("s:")){ const [,kind,about]=k.split(":"); CUR=null; F.symbol=""; F.project=""; F.kind=kind; F.about=about; markRail(k); pane("home"); return load(); }
    if(k.startsWith("id:")) return open(k.slice(3));
    if(k.startsWith("f:")){ const f=k.slice(2); location.href="/notes?new&file="+encodeURIComponent(f); }
  });
  const cur=F.symbol?"n:"+F.symbol:F.project?"p:"+F.project:F.about?"s:"+F.kind+":"+F.about:""; markRail(cur);
}

async function open(id){
  const r=await fetch("/api/notes/get?id="+encodeURIComponent(id)); const n=await r.json();
  if(n.error){return;}
  CUR=n; history.replaceState(null,"","/notes?id="+encodeURIComponent(id));
  pane("view");
  const links=(n.link_ids||[]).map(i=>NOTES.find(x=>x.id===i)).filter(Boolean), backs=(n.backlinks||[]).map(i=>NOTES.find(x=>x.id===i)).filter(Boolean);
  const syms=[...new Set([...(n.symbols||[]),...(n.implied_symbols||[])])];
  let g=null; try{ if(syms.length===1) g=await (await fetch("/api/notes/graph?symbol="+encodeURIComponent(syms[0]))).json(); }catch(e){}
  const related=g?(g.related_symbols||[]).filter(s=>!syms.includes(s)).slice(0,12):[];
  $("view").innerHTML=backLink+`<div class="view">
      <h1>${esc(n.title)}</h1>
      <div class="meta"><span class="ty">${TYPE_LABEL[n.type]||n.type}</span>${subj(n)?`<span style="color:var(--ink2)">${esc(subj(n))}</span>`:""}${n.period?`<span style="color:var(--ink2)">${esc(n.period)}</span>`:""}<span>updated ${esc(n.updated)}</span><span>created ${esc(n.created)}</span>${n.pinned?"<span>pinned</span>":""}${(n.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}<span class="mono" style="opacity:.7">${esc(n.path)}</span></div>
      ${n.file?(n.file_ok?`<div class="fcard"><div class="fi">${esc(fileExt(n.file))}</div><div class="fn"><b>${esc(n.file.split("/").pop())}</b><small>${fmtSize(n.file_size)} · ${esc(n.file)}</small></div><a class="op" href="${fileUrl(n.file)}" target="_blank" rel="noopener">Open</a><button id="v_detach">Remove file</button></div><div class="ftext" id="v_text">${textLine(n.text)}</div>${n.file_image?`<img class="fimg" src="${fileUrl(n.file)}" alt="">`:""}`:`<div class="fcard miss"><div class="fi">?</div><div class="fn"><b>${esc(n.file.split("/").pop())}</b><small>This file is not in the vault any more (${esc(n.file)}). Put it back in that folder, or take it off the note.</small></div><button id="v_detach">Take it off the note</button></div>`):""}
      <div id="v_ask"></div>
      <div class="md">${md(n.body||"")}</div>
      <div class="btns"><button class="pri" id="v_edit">Edit</button>${n.type==="project"?`<button id="v_proj">Every note in this project</button>`:""}</div>
    </div>
    <div class="conn">
      <div class="g"><div class="l">Names in this note</div>${syms.length?syms.map(s=>`<a class="sy" href="/t?symbol=${encodeURIComponent(s)}">$${esc(s)}</a>`).join(""):'<span style="font-size:11.5px;color:var(--muted)">none named</span>'}</div>
      ${n.about?`<div class="g"><div class="l">${esc(KIND_LABEL[n.kind]||n.kind)}</div><a href="/notes?kind=${encodeURIComponent(n.kind)}&about=${encodeURIComponent(n.about)}">${esc(n.about)}</a></div>`:""}
      ${n.period?`<div class="g"><div class="l">Period</div><a href="/notes?period=${encodeURIComponent(n.period)}">${esc(n.period)}</a></div>`:""}
      <div class="g"><div class="l">Project</div>${n.project?`<a href="/notes?project=${encodeURIComponent(n.project)}">${esc(n.project)}</a>`:'<span style="font-size:11.5px;color:var(--muted)">none</span>'}</div>
      <div class="g"><div class="l">Links out</div>${links.length?links.map(x=>`<a href="/notes?id=${encodeURIComponent(x.id)}" data-id="${esc(x.id)}" class="nl">${esc(x.title)}</a>`).join(""):'<span style="font-size:11.5px;color:var(--muted)">none</span>'}</div>
      <div class="g"><div class="l">Linked from</div>${backs.length?backs.map(x=>`<a href="/notes?id=${encodeURIComponent(x.id)}" data-id="${esc(x.id)}" class="nl">${esc(x.title)}</a>`).join(""):'<span style="font-size:11.5px;color:var(--muted)">none yet</span>'}</div>
      ${related.length?`<div class="g"><div class="l">Also connected, through your notes</div>${related.map(s=>`<a class="sy" href="/t?symbol=${encodeURIComponent(s)}">$${esc(s)}</a>`).join("")}</div>`:""}
    </div>`;
  wireBack(); markRail("id:"+id);
  if(window.deskBlocks) deskBlocks.hydrate($("view"));
  $("v_edit").onclick=()=>edit(n);
  if(n.text&&n.text.state==="reading"){ const poll=async()=>{ if(!CUR||CUR.id!==n.id) return; const t=await (await fetch("/api/research/text?path="+encodeURIComponent(n.file))).json(); if(t.state==="reading") return setTimeout(poll,2500); const el=$("v_text"); if(el) el.innerHTML=textLine(t); }; setTimeout(poll,2500); }
  const vd=$("v_detach"); if(vd) vd.onclick=()=>{
    const a=$("v_ask");
    a.innerHTML=n.file_ok?`<div class="ask" style="margin:0 0 14px">Take the file off this note: <button id="d_keep">keep the file in the vault</button><button id="d_del" class="danger">delete the file too</button><button id="d_no">leave it</button></div>`
                          :`<div class="ask" style="margin:0 0 14px">Take the missing file off this note? <button id="d_keep">yes</button><button id="d_no">no</button></div>`;
    $("d_no").onclick=()=>a.innerHTML="";
    $("d_keep").onclick=async()=>{ await post("/api/notes/detach",{id:n.id}); await load(); open(n.id); };
    const dd=$("d_del"); if(dd) dd.onclick=async()=>{ await post("/api/notes/detach",{id:n.id,delete_file:true}); await load(); open(n.id); };
  };
  const vp=$("v_proj"); if(vp) vp.onclick=()=>{CUR=null; F.project=n.title; F.symbol=""; pane("home"); load();};
  $("view").querySelectorAll("a.nl, a.wl[data-id]").forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.id);});
}

$("attachbtn").onclick=()=>{ edit(null); setTimeout(()=>$("e_fileinput").click(),50); };
/* Tasks: what is due, from the calendar, from answers, from notes and from the reader */
const CAT_LABEL={results:"Results",filing:"Filing","follow-up":"Follow-up",model:"Model",reading:"Reading",call:"Call",other:"Other"};
function taskRow(t,over){
  const meta=[t.symbol?`<span class="sy">$${esc(t.symbol)}</span>`:"",t.due?`<span class="due">due ${esc(t.due)}</span>`:"",t.category?esc(CAT_LABEL[t.category]||t.category):"",t.source==="note"?`in <a href="/notes?id=${encodeURIComponent(t.note_id)}" style="color:var(--ink2)">${esc(t.note)}</a>`:t.source&&t.source!=="you"?"via "+esc(t.source):"",t.done_at?"done "+esc(t.done_at):""].filter(Boolean).join(" · ");
  return `<div class="tk${t.done?" done":""}${over?" over":""}" data-line="${t.line}" data-note="${esc(t.note_id||"")}"><input type="checkbox"${t.done?" checked":""}><span><span class="t">${esc(t.text)}</span><span class="m">${meta}</span></span>${t.source==="note"||t.line<0?"<span></span>":`<button class="x" title="remove this task">✕</button>`}</div>`;
}
async function showTasks(){
  CUR=null; pane("view"); history.replaceState(null,"","/notes?tasks"); markRail("tasks");
  let v; try{ v=await (await fetch("/api/research/tasks"+(F.symbol?"?symbol="+encodeURIComponent(F.symbol):""))).json(); }catch(e){ return; }
  const o=v.open||{}, B=[["overdue","Overdue","over"],["today","Due today","today"],["week","This week",""],["later","Later",""],["undated","No date",""]];
  $("view").innerHTML=backLink+`<div class="view"><h1>Tasks${F.symbol?" · $"+esc(F.symbol):""}</h1>
    <div class="meta"><span><b style="color:var(--ink2)">${v.counts.open}</b> open${v.counts.due?`, <b style="color:var(--neg)">${v.counts.due}</b> due`:""}</span><span>results dates for the names you hold, watch or are researching arrive on their own; ticking one keeps it ticked</span><span class="mono" style="opacity:.7">${esc(v.path)}</span></div>
    <div class="tadd"><input id="t_text" placeholder="A task: check the segment split before the call…" maxlength="200"><input id="t_sym" placeholder="symbol" value="${esc(F.symbol||"")}" style="text-transform:uppercase"><input id="t_due" type="date" title="due"><select id="t_cat"><option value="">category</option>${(v.categories||[]).map(c=>`<option value="${c}">${CAT_LABEL[c]||c}</option>`).join("")}</select><button id="t_add">Add</button></div>
    ${v.counts.open?B.map(([k,label,cls])=>o[k]&&o[k].length?`<div class="tb ${cls}">${label} · ${o[k].length}</div>${o[k].map(t=>taskRow(t,k==="overdue")).join("")}`:"").join(""):`<div style="font-size:12.5px;color:var(--muted);line-height:1.6">Nothing open. A results date for a name you hold or watch shows up here on its own; an answer in the Ask box has Save as task under it; and a line typed above, or a checkbox in any note, lands here too.</div>`}
    ${v.done&&v.done.length?`<div class="tb">Done lately · ${v.done.length}</div>${v.done.map(t=>taskRow(t)).join("")}`:""}
  </div>`;
  wireBack();
  $("t_add").onclick=async()=>{ const text=$("t_text").value.trim(); if(!text) return; const r=await post("/api/research/tasks/add",{text,symbol:$("t_sym").value.trim(),due:$("t_due").value,category:$("t_cat").value}); if(r.ok) showTasks(); };
  $("t_text").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();$("t_add").click();} });
  $("view").querySelectorAll(".tk").forEach(el=>{
    const cb=el.querySelector("input[type=checkbox]"), line=+el.dataset.line, note=el.dataset.note;
    cb.onchange=async()=>{ let body; if(note) body={note_id:note,line,done:cb.checked}; else if(line<0){ const t=findCal(el); body={line:-1,task:t,done:true}; } else body={line,done:cb.checked};
      const r=await post("/api/research/tasks/tick",body); if(r.ok){ showTasks(); if(window.deskJournal) deskJournal(r.journal); } };
    const x=el.querySelector(".x"); if(x) x.onclick=async()=>{ await post("/api/research/tasks/delete",{line}); showTasks(); };
  });
  function findCal(el){ const text=el.querySelector(".t").textContent; for(const k in o) for(const t of o[k]) if(t.line<0&&t.text===text) return t; return null; }
}
/* the Journal: the moments the desk saw (held, or written), the reader's own lines, and the whys */
async function showJournal(){
  CUR=null; pane("view"); history.replaceState(null,"","/notes?journal"); markRail("journal");
  let j; try{ j=await (await fetch("/api/research/journal")).json(); }catch(e){ return; }
  const MODE={ask:"asks you about each moment",always:"writes every moment on its own",never:"is off; your own lines still go in"};
  const pend=j.pending||[], days=j.days||[];
  $("view").innerHTML=backLink+`<div class="view"><h1>Journal</h1>
    <div class="meta"><span>The journal ${MODE[j.mode]||""}. <a href="/settings" style="color:var(--accent);text-decoration:none">Change that on Settings</a>.</span></div>
    <div class="jown"><input id="j_own" placeholder="Your own line for today: what you did, what you thought. Enter writes it." maxlength="300"><button id="j_add">Write</button></div>
    ${pend.length?`<div class="jpend"><div class="l">Held for you · ${pend.length}</div>${pend.map(e=>`<div class="je" data-id="${esc(e.id)}"><span class="t">${esc(e.at.slice(5))}</span><span><span class="sy">${e.symbol?"$"+esc(e.symbol):""}</span>${esc(e.text)}${e.decision?`<input class="pw" placeholder="why? one line, or leave it">`:""}<div class="ask" style="margin-top:6px"><button class="pw1">write it</button><button class="pw0 danger">let it go</button></div></span></div>`).join("")}</div>`:""}
    ${days.length?days.map(d=>`<div class="jday"><h3><span>${esc(d.title)}</span><small>${esc(d.path)}</small></h3>${d.entries.map(e=>`<div class="je" data-date="${esc(d.date)}" data-line="${e.line}"><span class="t">${esc(e.time)}</span><span><span class="sy">${e.symbol?"$"+esc(e.symbol):""}</span>${esc(e.text)}${e.why?`<span class="why">${esc(e.why)}</span>`:""}<span class="addwhy">${e.why?"change the why":"add a why"}</span></span></div>`).join("")}</div>`).join(""):`<div style="font-size:12.5px;color:var(--muted);line-height:1.6">Nothing written yet. ${j.mode==="never"?"The journal is off; your own lines above still go in.":"The first moment the desk sees (a name added to the book, a status set, a note saved) lands here"+(j.mode==="ask"?" once you say so":"")+"."}</div>`}
  </div>`;
  wireBack();
  $("j_add").onclick=async()=>{ const t=$("j_own").value.trim(); if(!t) return; const r=await post("/api/research/journal/add",{text:t,symbol:F.symbol||""}); if(r.ok) showJournal(); };
  $("j_own").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();$("j_add").click();} });
  $("view").querySelectorAll(".jpend .je").forEach(el=>{ const id=el.dataset.id; const w=el.querySelector(".pw");
    el.querySelector(".pw1").onclick=async()=>{ await post("/api/research/journal/decide",{id,write:true,why:w?w.value:""}); showJournal(); };
    el.querySelector(".pw0").onclick=async()=>{ await post("/api/research/journal/decide",{id,write:false}); showJournal(); }; });
  $("view").querySelectorAll(".jday .je").forEach(el=>{ const a=el.querySelector(".addwhy"); a.onclick=()=>{ if(el.querySelector("input")) return; const cur=el.querySelector(".why"); const inp=document.createElement("input"); inp.value=cur?cur.textContent:""; inp.placeholder="why? one line"; inp.maxLength=500; a.replaceWith(inp); inp.focus();
    const done=async(save)=>{ if(save){ await post("/api/research/journal/why",{date:el.dataset.date,line:+el.dataset.line,why:inp.value}); } showJournal(); };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();done(true);} if(e.key==="Escape") done(false); }); inp.addEventListener("blur",()=>done(true)); }; });
}
/* the Timeline: everything about one name by period and date */
async function showTimeline(sym){
  let tl; try{ tl=await (await fetch("/api/research/timeline?symbol="+encodeURIComponent(sym))).json(); }catch(e){ return; }
  if(CUR||$("ed").style.display!=="none"||F.symbol!==sym) return;
  const st=tl.status||{};
  pane("view"); history.replaceState(null,"","/notes?symbol="+encodeURIComponent(sym)); markRail("n:"+sym);
  $("view").innerHTML=backLink+`<div class="view"><h1 style="font-family:Menlo,monospace">$${esc(sym)}</h1>
    <div class="meta"><span>${st.status?`status <b style="color:var(--ink2)">${esc(STATUS_LABEL[st.status]||st.status)}</b>${st.set_by==="you"&&st.since?" since "+esc(st.since):st.set_by==="the desk"?" (what the desk can see)":""}`:"no status yet; set one on the listing's page"}</span><span>${tl.count||0} item${tl.count===1?"":"s"}, by the period each belongs to</span><a href="/t?symbol=${encodeURIComponent(sym)}" style="color:var(--accent);text-decoration:none">the listing's page</a></div>
    <div class="btns" style="margin:0 0 16px"><button class="pri" id="tl_new">New note on $${esc(sym)}</button><button id="tl_file">Bring a file in</button><button id="tl_tasks">Tasks on $${esc(sym)}</button></div>
    ${tl.count?(tl.groups||[]).map(gp=>`<div class="tl-g"><div class="l">${esc(gp.period||"no period")}</div>${gp.items.map(it=>it.what==="status"?`<div class="tl-r"><span class="d">${esc(it.date)}</span><span class="ty">status</span><span style="color:var(--ink2)">${esc(STATUS_LABEL[it.status]||it.status)}</span></div>`:`<div class="tl-r"><span class="d">${esc(it.date)}</span><span class="ty">${TYPE_LABEL[it.type]||it.type}</span><a href="/notes?id=${encodeURIComponent(it.id)}" data-id="${esc(it.id)}" class="nl">${esc(it.title)}</a>${it.file?`<span class="fx${it.file_ok?"":" miss"}">${it.file_ok?esc((it.file.split(".").pop()||"").toUpperCase()):"file missing"}</span>`:""}</div>`).join("")}</div>`).join(""):`<div class="empty">Nothing about $${esc(sym)} yet. The first note or file lands here, by the period it belongs to, and stays: a note from twelve months back is one line down, never gone.</div>`}</div>`;
  wireBack();
  $("view").querySelectorAll("a.nl").forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.id);});
  $("tl_new").onclick=()=>{ P.set("symbol",sym); edit(null); };
  $("tl_file").onclick=()=>{ P.set("symbol",sym); edit(null); setTimeout(()=>$("e_fileinput").click(),50); };
  $("tl_tasks").onclick=()=>showTasks();
}
function edit(n){
  CUR=n||null; pane("ed");
  $("bkchips").innerHTML=["quote AAPL","chart AAPL 1y","watch AAPL MSFT","commodity wti","status AAPL","notes AAPL 5","tasks AAPL","timeline AAPL","book"].map(b=>`<button type="button" class="chip bkchip" data-b="${b}">${b.split(" ")[0]}</button>`).join(" ");
  wireBlocks();
  $("e_type").innerHTML=TYPES.map(t=>`<option value="${t}">${TYPE_LABEL[t]||t}</option>`).join("");
  $("e_kind").innerHTML=KINDS.map(t=>`<option value="${t}">${KIND_LABEL[t]||t}</option>`).join("");
  $("e_title").value=n?n.title:""; $("e_type").value=n?n.type:(P.get("type")||"general"); $("e_pin").checked=!!(n&&n.pinned);
  EDIT.syms=n?[...n.symbols]:(P.get("symbol")?[P.get("symbol").toUpperCase()]:[]); drawSyms();
  $("e_kind").value=n?n.kind:(P.get("kind")||(EDIT.syms.length?"stock":"general")); $("e_about").value=n?(n.about||""):(P.get("about")||""); $("e_period").value=n?(n.period||""):(P.get("period")||""); kindChanged();
  $("e_project").value=n?(n.project||""):(P.get("project")||""); $("e_tags").value=n?(n.tags||[]).join(", "):""; $("e_body").value=n?n.body:"";
  $("e_del").style.display=n?"inline-block":"none"; say("");
  EDIT.pending=null; EDIT.file=n?(n.file||""):(P.get("file")||""); drawFile();
  if(!n&&EDIT.file){ const nm=EDIT.file.split("/").pop(); if(!$("e_title").value) $("e_title").value=nm.replace(/\.[^.]+$/,"").replace(/_+/g," "); const ext=(nm.split(".").pop()||"").toLowerCase(); $("e_type").value=/^(xlsx|xls|xlsm|csv|numbers|ods)$/.test(ext)?"model":/^(png|jpe?g|gif|webp)$/.test(ext)?"clipping":"document"; }
  ($("e_title").value?$("e_body"):$("e_title")).focus();
  if(!n&&P.has("attach")){ P.delete("attach"); history.replaceState(null,"","/notes?"+P); setTimeout(()=>$("e_fileinput").click(),50); }
}
function drawFile(){
  const el=$("e_file");
  if(EDIT.pending) el.innerHTML=`<span class="fchip">${esc(EDIT.pending.name)} · ${fmtSize(EDIT.pending.size)} <span class="x" id="e_unpick" title="do not attach">✕</span></span>`;
  else if(EDIT.file) el.innerHTML=`<span class="fchip"><a href="${fileUrl(EDIT.file)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(EDIT.file.split("/").pop())}</a> <span class="x" id="e_unpick" title="take the file off this note (it stays in the vault)">✕</span></span>`;
  else el.innerHTML="";
  const u=$("e_unpick"); if(u) u.onclick=()=>{ EDIT.pending=null; EDIT.file=""; drawFile(); };
  $("e_attach").textContent=(EDIT.pending||EDIT.file)?"Attach a different file":"Attach a file";
}
function pickFile(f){
  if(!f) return;
  EDIT.pending=f; drawFile();
  if(!$("e_title").value.trim()) $("e_title").value=f.name.replace(/\.[^.]+$/,"").replace(/_+/g," ");
  if($("e_type").value==="general"){ const ext=(f.name.split(".").pop()||"").toLowerCase(); $("e_type").value=/^(xlsx|xls|xlsm|csv|numbers|ods)$/.test(ext)?"model":/^(png|jpe?g|gif|webp)$/.test(ext)?"clipping":"document"; }
}
$("e_attach").onclick=()=>$("e_fileinput").click();
function wireBlocks(){ document.querySelectorAll(".bkchip").forEach(b=>b.onclick=()=>{ const ta=$("e_body"); const sym=EDIT.syms[0]||"AAPL"; const spec=b.dataset.b.replace(/AAPL/g,sym).replace(/MSFT/g,EDIT.syms[1]||"MSFT"); const ins="\n```desk\n"+spec+"\n```\n"; const p=ta.selectionStart||ta.value.length; ta.value=ta.value.slice(0,p)+ins+ta.value.slice(p); ta.focus(); ta.selectionStart=ta.selectionEnd=p+ins.length; }); }
$("e_fileinput").addEventListener("change",()=>{ pickFile($("e_fileinput").files[0]); $("e_fileinput").value=""; });
$("ed").addEventListener("dragover",e=>{ e.preventDefault(); $("ed").classList.add("drop"); });
$("ed").addEventListener("dragleave",()=>$("ed").classList.remove("drop"));
$("ed").addEventListener("drop",e=>{ e.preventDefault(); $("ed").classList.remove("drop"); if(e.dataTransfer.files&&e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]); });
// a picture on the clipboard (a chart copied from TradingView's camera, a screenshot) pasted into the editor attaches itself
document.addEventListener("paste",e=>{ if($("ed").style.display==="none") return; const it=[...((e.clipboardData||{}).items||[])].find(x=>x.type.startsWith("image/")); if(!it) return; e.preventDefault(); const f=it.getAsFile(); const ext=(f.type.split("/")[1]||"png").replace("jpeg","jpg"); pickFile(new File([f],(f.name&&f.name!=="image."+ext?f.name:`clipping-${new Date().toISOString().slice(0,10)}.${ext}`),{type:f.type})); });
function kindChanged(){ const k=$("e_kind").value; $("e_about").style.display=k==="stock"?"none":"inline-block"; $("e_about").placeholder=ABOUT_HINT[k]||""; }
$("e_kind").addEventListener("change",kindChanged);
function drawSyms(){ $("e_syms").innerHTML=EDIT.syms.map(s=>`<span class="chip sym" data-s="${esc(s)}">$${esc(s)}<span class="x">✕</span></span>`).join(""); $("e_syms").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{EDIT.syms=EDIT.syms.filter(x=>x!==c.dataset.s);drawSyms();}); }
$("newbtn").onclick=()=>edit(null);
$("e_cancel").onclick=()=>{ if(CUR&&CUR.body!==undefined) open(CUR.id); else goHome(); };
$("e_back").onclick=e=>{ e.preventDefault(); goHome(); };
$("e_save").onclick=async()=>{
  const body={id:CUR?CUR.id:"", title:$("e_title").value.trim(), kind:$("e_kind").value, type:$("e_type").value, pinned:$("e_pin").checked, symbols:EDIT.syms, about:$("e_about").value.trim(), period:$("e_period").value.trim(), project:$("e_project").value.trim(), tags:$("e_tags").value.split(",").map(s=>s.trim()).filter(Boolean), body:$("e_body").value, file:EDIT.file||""};
  if(!body.title) return say("A title first.","err");
  if(EDIT.pending){
    say(`Bringing ${EDIT.pending.name} into the vault…`);
    const qs=new URLSearchParams({name:EDIT.pending.name, symbol:body.kind==="stock"?(EDIT.syms[0]||""):"", about:body.kind==="stock"?"":body.about});
    let up; try{ up=await (await fetch("/api/research/upload?"+qs,{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:EDIT.pending})).json(); }catch(e){ up={ok:false,error:"the desk did not answer"}; }
    if(!up.ok) return say("The file did not go in: "+(up.error||"unknown"),"err");
    body.file=up.file; EDIT.pending=null; EDIT.file=up.file;
  }
  const r=await post("/api/notes/save",body);
  if(!r.ok) return say(r.error||("could not save "+window.NEXT_STEP),"err");
  say("Saved.","ok"); await load(); open(r.note.id);
  if(window.deskJournal) deskJournal(r.journal);
};
$("e_del").onclick=()=>{
  if(!CUR) return;
  const m=$("e_msg");
  m.className="msg";
  m.innerHTML=CUR.file&&CUR.file_ok?`<span class="ask">Delete "${esc(CUR.title)}"? <button id="x_note">the note only, keep its file</button><button id="x_both" class="danger">the note and its file</button><button id="x_no">keep it</button></span>`
                                    :`<span class="ask">Delete "${esc(CUR.title)}"? <button id="x_note" class="danger">delete</button><button id="x_no">keep it</button></span>`;
  const go=async(withFile)=>{ await post("/api/notes/delete",{id:CUR.id,with_file:withFile}); CUR=null; goHome(); };
  $("x_note").onclick=()=>go(false); $("x_no").onclick=()=>say("");
  const xb=$("x_both"); if(xb) xb.onclick=()=>go(true);
};
document.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="s"&&$("ed").style.display!=="none"){e.preventDefault();$("e_save").click();} });

/* symbol search for the names chips */
const symIn=$("e_symin"), sugg=$("sugg"); let sugT=null, hits=[];
function showSugg(h){ hits=h; if(!h.length){sugg.className="sugg";sugg.innerHTML="";return;}
  sugg.innerHTML=h.map((x,i)=>`<button type="button" data-i="${i}"><span class="sy">${esc(x.symbol)}</span><span class="n">${esc(x.name)}</span><span class="e">${esc(x.exch)}</span></button>`).join(""); sugg.className="sugg on";
  sugg.querySelectorAll("button").forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(+b.dataset.i);}); }
function pick(i){ const h=hits[i]; if(!h) return; if(!EDIT.syms.includes(h.symbol)) EDIT.syms.push(h.symbol); drawSyms(); symIn.value=""; showSugg([]); }
symIn.addEventListener("input",()=>{ clearTimeout(sugT); const q=symIn.value.trim(); if(q.length<2){showSugg([]);return;} sugT=setTimeout(async()=>{ try{ const d=await (await fetch("/api/symbols?q="+encodeURIComponent(q))).json(); if(symIn.value.trim()===q) showSugg(d.hits||[]); }catch(e){} },220); });
symIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); if(hits.length) pick(0); else { const s=symIn.value.trim().toUpperCase(); if(s&&!EDIT.syms.includes(s)){EDIT.syms.push(s);drawSyms();} symIn.value=""; } } if(e.key==="Escape") showSugg([]); });
symIn.addEventListener("blur",()=>setTimeout(()=>showSugg([]),150));

(async()=>{ try{ const pl=await (await fetch("/api/plugins")).json(); for(const src of (pl.blocks||[])){ const sc=document.createElement("script"); sc.src=src; document.head.appendChild(sc); } }catch(e){}
  await load(); if(P.get("id")) open(P.get("id")); else if(P.has("new")) edit(null); else if(P.has("journal")) showJournal(); else if(P.has("tasks")) showTasks(); else if(P.get("symbol")) showTimeline(P.get("symbol")); })();
</script>
</body>
</html>
