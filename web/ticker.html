<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticker · GreekSoup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='24' fill='%230F1114'/><path d='M22 38l16 22-16 22' stroke='%23ED5A24' stroke-width='12' stroke-linecap='square' stroke-linejoin='miter' fill='none'/><rect x='48' y='66' width='12' height='20' fill='%23ECEBE6'/><rect x='66' y='50' width='12' height='36' fill='%23ECEBE6'/><rect x='84' y='34' width='12' height='52' fill='%23ECEBE6'/></svg>">

<style>
body{padding-bottom:50px}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
.right{display:flex;gap:10px;align-items:center;white-space:nowrap}
input#go{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);
  border-radius:8px;padding:7px 12px;font-size:13px;width:150px;text-transform:uppercase;outline:none}
input#go:focus{border-color:var(--accent)}

main{max-width:1280px;margin:0 auto;padding:18px 22px}
.hero{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.hero .sym{font-size:26px;font-weight:800;letter-spacing:.03em}
.hero .co{font-size:14px;color:var(--ink2)}
.hero .badge{font-size:10px;color:var(--muted);border:1px solid var(--line2);
  border-radius:5px;padding:2px 7px;letter-spacing:.06em}
.hero .px{font-size:26px;font-weight:800}
.hero .chg{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 340px;gap:14px} .grid>div{min-width:0}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.grid.solo{grid-template-columns:1fr 340px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.panel-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.panel-h .s{font-size:10.5px;color:var(--muted)}
.panel-b{padding:13px 14px}

/* chart controls */
.fsbtn{background:var(--panel2);color:var(--ink2);border:1px solid var(--line2);
  border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer}
.fsbtn:hover{color:var(--accent);border-color:var(--accent)}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:2px 4px 2px 8px;font-size:11px;color:var(--ink2)}
.dchip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px;padding:0 3px} .dchip button:hover{color:var(--neg)}
.panel.fs{position:fixed;inset:14px;z-index:60;margin:0;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7)}
.seg{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:2px}
.seg button{background:none;border:none;color:var(--ink2);font-size:10.5px;padding:4px 9px;
  border-radius:5px;cursor:pointer;letter-spacing:.05em}
.seg button.on{background:var(--line2);color:var(--ink)}
.seg button:hover{color:var(--accent)}
#chartwrap{position:relative}
#tip{position:absolute;pointer-events:none;display:none;background:var(--panel2);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-size:11px;z-index:5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#tip .d{color:var(--muted);font-size:10px}
#tip .v{font-weight:700;font-size:13px}
.rangeret{font-size:12px;font-weight:700}
.stalebar{margin:0 0 12px;padding:9px 14px;border:1px solid var(--amber);border-radius:8px;color:var(--amber);font-size:12px}

.range{margin:10px 0 4px}
.range .cap{font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.range .track{height:5px;background:var(--line);border-radius:3px;position:relative}
.range .mark{position:absolute;top:-3.5px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg)}
.range .lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;background:var(--line)}
.st{background:var(--panel);padding:9px 12px}
.st .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.st .v{font-size:14px;font-weight:700;margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
tbody tr:last-child td{border-bottom:none}

.news-item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.news-item:last-child{border-bottom:none}
.news-item .t{color:var(--muted);font-size:10.5px;white-space:nowrap;min-width:72px}
.news-item .pub{color:var(--muted);font-size:10.5px}
.news-item a{color:var(--ink);font-size:12.5px}
.news-item a:hover{color:var(--accent)}

.an-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0}
.an-row .k{color:var(--ink2)}
.gbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.gbar i{display:block;height:100%}
.desc{font-size:12px;color:var(--ink2);line-height:1.6}
.loading{padding:60px;text-align:center;color:var(--muted)}
.poscard{background:linear-gradient(135deg,#1a1410,#12161d);border:1px solid #3a2a1a}

/* ---- financials panel ---- */
.fin-tabs{margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;
  background:var(--panel);padding:4px 8px;flex-wrap:wrap}
.finwrap{overflow-x:auto}
.fintab td.grp,.fintab th.grp{text-align:left}
.fintab td:first-child{color:var(--ink2)}
.fintab tr.sect td{color:var(--ink);font-weight:700;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;padding-top:13px;border-bottom:1px solid var(--line2)}
.fintab td.tot,.fintab tr.tot td{font-weight:700;color:var(--ink)}
.fin-note{font-size:10.5px;color:var(--muted);padding:9px 14px;line-height:1.5}
.fintab tr.chgrow td{font-size:10px;font-style:italic;padding-top:0;padding-bottom:6px;color:var(--muted)}
.fintab tr.chgrow td.pos{color:var(--pos);opacity:.85}
.fintab tr.chgrow td.neg{color:var(--neg);opacity:.85}
.fintab tr.chgrow td:first-child{font-weight:400}
.fintab tr.haschg td{border-bottom:none;padding-bottom:2px}
.peertab th{cursor:pointer;user-select:none}
.peertab th:hover{color:var(--accent)}
.dcfgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:900px){.dcfgrid{grid-template-columns:1fr}}
.dcf-as{margin-bottom:11px}
.dcf-as .l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:3px}
.dcf-as .l b{color:var(--ink);font-size:12px}
.dcf-as .hint{font-size:9.5px;color:var(--muted);margin-top:2px}
.dcf-as input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.dcfout{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:14px;height:fit-content}
.dcfout .big{font-size:24px;font-weight:800;margin:2px 0}
.dcfout .vs{font-size:13px;font-weight:700;margin-bottom:10px}
.dcfout .an-row{font-size:11.5px}
</style>

<body>
<header>
  <div class="brand">RESEARCH <span>DESK</span></div>
  <nav></nav>
  <div class="right">
    <input id="go" placeholder="Ticker… ⏎">
  </div>
</header>
<div id="notesdock"></div>
<main id="app"><div class="loading">Loading research view…</div></main>

<script>
"use strict";
const P = new URLSearchParams(location.search);
const SYM = (P.get("symbol")||"AAPL").toUpperCase();
const REG = (P.get("region")||"us").toLowerCase();
const HOME = REG!=="us";     // a home-market name: the broker's code or the exchange symbol
document.getElementById("go").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.value.trim())
    location.href="/t?symbol="+encodeURIComponent(e.target.value.trim().toUpperCase())+(HOME?"&region=home":"");});

const F=(x,dp=2)=>x==null||isNaN(x)?"—":Number(x).toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CUR = "$";               // the home market's currency symbol arrives with the page data
const money=(x,dp=2)=>x==null||isNaN(x)?"—":(x<0?"−"+CUR:CUR)+F(Math.abs(x),dp);
const usd=money;
// a move that prints as zero is flat: no sign, no colour
const flat=(x,eps=0.005)=>x!=null&&!isNaN(x)&&Math.abs(x)<eps;
const pct=(x,dp=2)=>x==null||isNaN(x)?"—":flat(x,0.5*Math.pow(10,-dp))?(0).toFixed(dp)+"%":(x>=0?"+":"−")+Math.abs(x).toFixed(dp)+"%";
const cls=(x,eps=0.005)=>x==null||isNaN(x)||flat(x,eps)?"dim":(x>=0?"pos":"neg");
const big=x=>{if(x==null)return "—";if(Math.abs(x)>=1e12)return "$"+(x/1e12).toFixed(2)+"T";
  if(Math.abs(x)>=1e9)return "$"+(x/1e9).toFixed(1)+"B";if(Math.abs(x)>=1e6)return "$"+(x/1e6).toFixed(0)+"M";return usd(x,0);};
const xr=(x,dp=1)=>x==null||isNaN(x)?"—":Number(x).toFixed(dp)+"x";
const pc=(x,dp=1)=>x==null||isNaN(x)?"—":(x*100).toFixed(dp)+"%";
const ago=iso=>{if(!iso)return "";const s=(Date.now()-new Date(iso.replace(" ","T")+(iso.includes("Z")?"":"Z")))/1e3;
  if(s<3600)return Math.max(1,Math.round(s/60))+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d";};

/* ============ CHART v3: native-pixel, fullscreen, intraday, premium ============ */
let HIST=[];               // oldest -> newest {date, price, o,h,l,v}
let INTRA={};              // {"1D":[...], "5D":[...]} where the source serves minute candles
let mode="candles", range="1Y", isFS=false;
const DAYRANGES={"1M":22,"3M":66,"6M":132,"1Y":252,"3Y":756,"5Y":1260,"MAX":1e9};
/* Range and bar size are two choices, as on any charting screen: the range says how far
   back, the bar size how much each candle holds. Each range has the sizes the free feed
   serves for it and a default; the size is remembered while it fits the next range. */
const RANGES=["1D","5D","1M","3M","6M","1Y","3Y","5Y","MAX"];
const INTERVALS={"5m":{label:"5-min bars",yahoo:"5m",min:5},"15m":{label:"15-min bars",yahoo:"15m",min:15},"30m":{label:"30-min bars",yahoo:"30m",min:30},
  "1h":{label:"hourly bars",yahoo:"1h",min:60},"1D":{label:"daily bars",yahoo:"1d"},"1W":{label:"weekly bars",yahoo:"1wk"},"1M":{label:"monthly bars",yahoo:"1mo"}};
const ALLOWED={"1D":["5m","15m","30m","1h"],"5D":["5m","15m","30m","1h","1D"],"1M":["15m","30m","1h","1D"],"3M":["1h","1D","1W"],"6M":["1h","1D","1W"],"1Y":["1D","1W"],"3Y":["1D","1W","1M"],"5Y":["1W","1M"],"MAX":["1W","1M"]};
const DEFAULT_INT={"1D":"5m","5D":"15m","1M":"1h","3M":"1D","6M":"1D","1Y":"1D","3Y":"1W","5Y":"1W","MAX":"1M"};
const YRANGE={"1D":"1d","5D":"5d","1M":"1mo","3M":"3mo","6M":"6mo","1Y":"1y","3Y":"3y","5Y":"5y","MAX":"max"};
let interval=DEFAULT_INT[range];
const BARS={};             // "range|interval" -> rows fetched at that size; "…:loading" while on the way
const isIntra=i=>!!INTERVALS[i].min;

function rangeList(){ return RANGES; }
function intervalList(){ return ALLOWED[range]||["1D"]; }
/* The bars for the range at the bar size: intraday sizes fold the five-minute feed the page
   already holds (1D, 5D) or come from the feed at that size (longer ranges); daily bars slice
   the ten-year history; weekly and monthly fold the daily bars. */
function sliced(){
  const iv=INTERVALS[interval];
  if(isIntra(interval)){
    if((range==="1D"||range==="5D")&&(INTRA[range]||[]).length){
      const base=INTRA[range];
      return iv.min===5 ? base : resampleOHLC(base, "m"+iv.min);
    }
    const key=range+"|"+interval;
    if(Array.isArray(BARS[key])) return BARS[key];
    fetchBars(key); return [];
  }
  const n=DAYRANGES[range]||5;
  let pts = range==="1D"||range==="5D" ? HIST.slice(-5) : (n>=HIST.length?HIST:HIST.slice(HIST.length-n));
  // the free history is daily for ten years and quarterly before that; a range that reaches
  // into the quarterly stretch is drawn as quarterly bars whatever size is picked
  if(pts.some((p,i)=>i&&Date.parse(p.date)-Date.parse(pts[i-1].date)>45*864e5)) return resampleOHLC(pts,"Q");
  if(interval==="1W") return resampleOHLC(pts,"W");
  if(interval==="1M") return resampleOHLC(pts,"M");
  return pts;
}
async function fetchBars(key){
  if(BARS[key]==="loading") return;
  BARS[key]="loading";
  const [r,i]=key.split("|");
  try{
    const res=await fetch(`/api/candles?symbol=${encodeURIComponent(FINSYM||SYM)}&range=${YRANGE[r]}&interval=${INTERVALS[i].yahoo}`);
    const d=await res.json();
    BARS[key]=(d.rows||[]).map(x=>({date:(x.date||"").slice(0,16),price:x.price,o:x.o,h:x.h,l:x.l,v:x.v}));
  }catch(e){ BARS[key]=[]; }
  if(range===r&&interval===i) drawChart();
}
/* Aggregate bars to a wider bucket so CANDLES stays candles on long ranges
   (the Koyfin/TradingView behaviour) instead of falling back to a line. */
function resampleOHLC(pts,bucket){
  const out=[]; let cur=null, key="";
  for(const p of pts){
    const k = bucket==="M" ? (p.date||"").slice(0,7)
      : bucket==="Q" ? (p.date||"").slice(0,4)+"Q"+Math.ceil(+(p.date||"").slice(5,7)/3)
      : bucket[0]==="m" ? (p.date||"").slice(0,13)+Math.floor(+(p.date||"").slice(14,16)/+bucket.slice(1))*(+bucket.slice(1)>=60?0:1)
      : String(Math.floor((Date.parse(p.date)/864e5+4)/7));   // ISO-ish week bucket
    if(k!==key){ if(cur)out.push(cur); key=k;
      cur={date:p.date,o:p.o??p.price,h:p.h??p.price,l:p.l??p.price,price:p.price,v:p.v||0};
    }else{
      cur.h=Math.max(cur.h,p.h??p.price); cur.l=Math.min(cur.l,p.l??p.price);
      cur.price=p.price; cur.v+=(p.v||0);
      if(bucket[0]!=="m") cur.date=p.date;    // stamp = period end; intraday keeps the bar's open time
    }
  }
  if(cur)out.push(cur);
  return out;
}
function seriesFor(pts,intra){
  if(mode!=="drawdown") return pts.map(p=>({d:p.date,v:p.price}));
  if(!intra&&HIST.length){
    // running peak over FULL loaded history, not just the visible window —
    // a 1Y view starts below zero when the peak is older than the window.
    let peak=-Infinity; const dd={};
    for(const p of HIST){peak=Math.max(peak,p.price); dd[p.date]=(p.price/peak-1)*100;}
    return pts.map(p=>({d:p.date,v:dd[p.date]??0}));
  }
  let peak=-Infinity;
  return pts.map(p=>{peak=Math.max(peak,p.price);return {d:p.date,v:(p.price/peak-1)*100};});
}
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function xLabel(d){
  if(isIntra(interval)) return range==="1D" ? d.slice(11,16) : (range==="5D" ? d.slice(8,10)+" · "+d.slice(11,16) : d.slice(5,10));
  if(range==="1M"||range==="3M") return d.slice(5,10);
  if(range==="6M"||range==="1Y"||range==="3Y"||range==="5Y") return MONS[+d.slice(5,7)-1]+" "+d.slice(2,4);
  return d.slice(0,4);
}
function niceStep(span){
  const raw=span/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,2.5,5,10]) if(raw<=m*mag) return m*mag;
  return 10*mag;
}
function sma(arr,n){
  const out=new Array(arr.length).fill(null); let sum=0;
  for(let i=0;i<arr.length;i++){
    sum+=arr[i]; if(i>=n)sum-=arr[i-n];
    if(i>=n-1)out[i]=sum/n;
  }
  return out;
}
/* The desk's own chart is drawn by TradingView's open-source Lightweight Charts (Apache-2.0,
   the file lives in web/assets, nothing is fetched): candles, a line, or drawdown, the free
   feed's bars at the reader's range and bar size, MA50 and MA200 from daily closes, volume
   below. Their small mark stays on the chart, as their licence asks. The same drawing is
   what "Save chart to notes" keeps. */
let LWC=null, LSERIES=[], LDATA={pts:[],S:[]};
const tok=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// daily bars carry a day; intraday bars carry the exchange's own wall clock, kept as it is
const toTime=d=>isIntra(interval)&&d.length>=16 ? Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10),+d.slice(11,13),+d.slice(14,16))/1000 : d.slice(0,10);
// each study pane adds to the box, so the price keeps its room
function chartHeight(){ const extra=(mode==="drawdown"?0:((IND.rsi?1:0)+(IND.macd?1:0)))*100; return isFS ? Math.max(380, window.innerHeight-150) : 300+extra; }
function ensureChart(){
  const el=document.getElementById("chart");
  if(LWC){ LWC.applyOptions({height:chartHeight()}); return LWC; }
  el.style.height=chartHeight()+"px"; el.style.position="relative";
  LWC=LightweightCharts.createChart(el,{
    autoSize:true,
    layout:{background:{type:"solid",color:"transparent"},textColor:tok("--muted"),fontFamily:"-apple-system,Segoe UI,Helvetica,Arial,sans-serif",fontSize:11,attributionLogo:true},
    grid:{vertLines:{color:tok("--grid")},horzLines:{color:tok("--grid")}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:tok("--line2"),labelBackgroundColor:tok("--panel2")},horzLine:{color:tok("--line2"),labelBackgroundColor:tok("--panel2")}},
    rightPriceScale:{borderColor:tok("--line"),scaleMargins:{top:0.06,bottom:0.22}},
    timeScale:{borderColor:tok("--line"),timeVisible:true,secondsVisible:false,rightOffset:2},
    localization:{timeFormatter:t=>typeof t==="number"?new Date(t*1000).toISOString().slice(0,16).replace("T"," "):t},
    handleScale:{axisPressedMouseMove:true}, handleScroll:true,
  });
  // the range is the window: whenever the box changes size (full screen, a narrower window), the bars refill it
  if(window.ResizeObserver) new ResizeObserver(()=>{ if(LDATA.pts.length) LWC.timeScale().fitContent(); }).observe(el);
  bindDrawClicks(LWC);
  LWC.subscribeCrosshairMove(param=>{
    const tip=document.getElementById("tip"); if(!tip) return;
    if(!param.time||!param.point){ tip.style.display="none"; return; }
    const key=typeof param.time==="number"?param.time:param.time;
    const i=LDATA.times.indexOf(key); if(i<0){ tip.style.display="none"; return; }
    const p=LDATA.pts[i], s=LDATA.S[i];
    tip.innerHTML = mode==="drawdown"
      ? `<div class="d">${s.d}</div><div class="v mono">${s.v.toFixed(1)}%</div>`
      : (p.o!=null
        ? `<div class="d">${s.d}</div><div class="v mono">${money(p.price)}</div><div class="d mono">O ${F(p.o)} · H ${F(p.h)} · L ${F(p.l)}</div>${p.v!=null?`<div class="d mono">Vol ${F(p.v,0)}</div>`:""}`
        : `<div class="d">${s.d}</div><div class="v mono">${money(s.v)}</div>`);
    tip.style.display="block"; tip.style.left="10px"; tip.style.top="8px";   // a legend at the top left, as charting screens do
  });
  return LWC;
}
function clearSeries(){ for(const s of LSERIES){ try{ LWC.removeSeries(s); }catch(e){} } LSERIES=[]; }
/* Indicators, the way a charting screen has them: overlays on the price (moving averages,
   Bollinger Bands, VWAP), studies in their own panes below (RSI, MACD), volume, and a log
   scale. The reader's picks are remembered on this computer. Every study is computed here
   from the free feed's bars: daily studies on the full daily record so the first bars on
   screen already carry a settled value; intraday studies on the session's bars. */
const IND_DEF={sma20:0,sma50:1,sma100:0,sma200:1,ema9:0,ema21:0,ema50:0,bb:0,vwap:0,rsi:0,macd:0,vol:1,log:0};
const IND_LABEL={sma20:"SMA 20",sma50:"SMA 50",sma100:"SMA 100",sma200:"SMA 200",ema9:"EMA 9",ema21:"EMA 21",ema50:"EMA 50",bb:"Bollinger Bands (20, 2)",vwap:"VWAP (intraday, resets each day)",rsi:"RSI (14)",macd:"MACD (12, 26, 9)",vol:"Volume",log:"Log scale"};
const IND_COL={sma20:"#e0c060",sma50:"--amber",sma100:"#c98bd9",sma200:"--cyan",ema9:"#7bd389",ema21:"#5d9cff",ema50:"#ff8ab3",bb:"#8ea0b8",vwap:"#ffd166"};
let IND=(()=>{ try{ return {...IND_DEF,...JSON.parse(localStorage.getItem("gs.chart.ind")||"{}")}; }catch(e){ return {...IND_DEF}; } })();
function saveInd(){ try{ localStorage.setItem("gs.chart.ind",JSON.stringify(IND)); }catch(e){} }
const colOf=k=>IND_COL[k].startsWith("--")?tok(IND_COL[k]):IND_COL[k];
function ema(arr,n){ const out=new Array(arr.length).fill(null); const k=2/(n+1); let e=null;
  for(let i=0;i<arr.length;i++){ const v=arr[i]; if(v==null) continue; e=e==null?v:v*k+e*(1-k); if(i>=n-1) out[i]=e; } return out; }
function rsi(arr,n){ const out=new Array(arr.length).fill(null); let ag=0,al=0;
  for(let i=1;i<arr.length;i++){ const d=arr[i]-arr[i-1], g=Math.max(d,0), l=Math.max(-d,0);
    if(i<=n){ ag+=g/n; al+=l/n; if(i===n) out[i]=al===0?100:100-100/(1+ag/al); }
    else{ ag=(ag*(n-1)+g)/n; al=(al*(n-1)+l)/n; out[i]=al===0?100:100-100/(1+ag/al); } } return out; }
function macd(arr){ const f=ema(arr,12), s=ema(arr,26); const line=arr.map((_,i)=>f[i]!=null&&s[i]!=null?f[i]-s[i]:null);
  const first=line.findIndex(v=>v!=null); const sig=new Array(arr.length).fill(null); const e=ema(line.slice(first),9); for(let i=0;i<e.length;i++) sig[first+i]=e[i];
  return {line,sig,hist:line.map((v,i)=>v!=null&&sig[i]!=null?v-sig[i]:null)}; }
function bollinger(arr,n,k){ const m=sma(arr,n); const up=[],lo=[]; for(let i=0;i<arr.length;i++){ if(m[i]==null){up.push(null);lo.push(null);continue;} let s=0; for(let j=i-n+1;j<=i;j++) s+=(arr[j]-m[i])**2; const sd=Math.sqrt(s/n); up.push(m[i]+k*sd); lo.push(m[i]-k*sd); } return {mid:m,up,lo}; }
function vwap(pts){ const out=[]; let day="",pv=0,vv=0; for(const p of pts){ const d=(p.date||"").slice(0,10); if(d!==day){day=d;pv=0;vv=0;} const tp=((p.h??p.price)+(p.l??p.price)+p.price)/3; pv+=tp*(p.v||0); vv+=p.v||0; out.push(vv?pv/vv:null); } return out; }
function renderIndicators(chart,rows,intra,quarterly,DAILY){
  let legend="";
  const on=k=>!!IND[k];
  const base=intra?LDATA.pts:DAILY;                     // the record a study is computed on
  const closes=base.map(p=>p.price);
  const join=(vals)=>{ const by={}; for(let i=0;i<base.length;i++) if(vals[i]!=null) by[base[i].date]=vals[i]; return rows.filter(r=>by[r.p.date]!=null).map(r=>({time:r.t,value:by[r.p.date]})); };
  const line=(data,color,opts,pane)=>{ if(data.length<2) return null; const s=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,...(opts||{})},pane||0); s.setData(data); LSERIES.push(s); return s; };
  const tag=(k,color)=>{ legend+=`<span style="color:${color};font-size:10px;margin-left:10px">— ${IND_LABEL[k].replace(/ \(.*/,"")}</span>`; };
  if(mode!=="drawdown"&&!quarterly){
    for(const k of ["sma20","sma50","sma100","sma200","ema9","ema21","ema50"]){
      if(!on(k)) continue; const n=+k.replace(/\D/g,""); if(closes.length<n+5) continue;
      const v=k.startsWith("sma")?sma(closes,n):ema(closes,n); if(line(join(v),colOf(k))) tag(k,colOf(k));
    }
    if(on("bb")&&closes.length>25){ const b=bollinger(closes,20,2); const c=colOf("bb"); if(line(join(b.up),c,{lineStyle:LightweightCharts.LineStyle.Dotted})){ line(join(b.lo),c,{lineStyle:LightweightCharts.LineStyle.Dotted}); line(join(b.mid),c+"99"); tag("bb",c); } }
    if(on("vwap")&&intra){ const c=colOf("vwap"); if(line(join(vwap(base)),c,{lineWidth:2})) tag("vwap",c); }
  }
  // studies in panes below the price: each pane its own scale, the price pane keeps most of the height
  let pane=1;
  if(on("rsi")&&closes.length>20&&mode!=="drawdown"){
    const r=rsi(closes,14); const s=line(join(r),"#c98bd9",{lastValueVisible:true,priceLineVisible:false,priceFormat:{type:"price",precision:1,minMove:0.1}},pane);
    if(s){ s.createPriceLine({price:70,color:tok("--neg")+"88",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:false}); s.createPriceLine({price:30,color:tok("--pos")+"88",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:false}); tag("rsi","#c98bd9"); pane++; }
  }
  if(on("macd")&&closes.length>40&&mode!=="drawdown"){
    const m=macd(closes); const pos=tok("--pos"), neg=tok("--neg");
    const hist=chart.addSeries(LightweightCharts.HistogramSeries,{priceLineVisible:false,lastValueVisible:false,priceFormat:{type:"price",precision:2,minMove:0.01}},pane);
    const hd=join(m.hist); if(hd.length>2){ hist.setData(hd.map(x=>({...x,color:x.value>=0?pos+"88":neg+"88"}))); LSERIES.push(hist);
      line(join(m.line),"#5d9cff",{lastValueVisible:true},pane); line(join(m.sig),"#ff8ab3",{},pane); tag("macd","#5d9cff"); pane++; }
    else { try{ chart.removeSeries(hist); }catch(e){} }
  }
  // the panes' heights: the price keeps three quarters, each study a slice
  try{ const ps=chart.panes(); if(ps.length>1){ ps[0].setStretchFactor(3); for(let i=1;i<ps.length;i++) ps[i].setStretchFactor(1); } }catch(e){}
  return legend;
}
function renderIndMenu(){
  const m=document.getElementById("indmenu"); if(!m) return;
  const groups=[["On the price",["sma20","sma50","sma100","sma200","ema9","ema21","ema50","bb","vwap"]],["Below the price",["rsi","macd","vol"]],["Scale",["log"]]];
  m.innerHTML=groups.map(([h,keys])=>`<div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin:8px 0 4px">${h}</div>`+keys.map(k=>`<label style="display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;font-size:12px"><input type="checkbox" data-k="${k}" ${IND[k]?"checked":""} style="accent-color:var(--accent)"><span style="color:${IND_COL[k]?colOf(k):"var(--ink)"}">${IND_LABEL[k]}</span></label>`).join("")).join("")+`<div style="margin-top:8px"><button class="fsbtn" id="indreset" style="padding:2px 8px;font-size:11px">Back to the defaults</button></div>`;
  m.querySelectorAll("input").forEach(c=>c.onchange=()=>{ IND[c.dataset.k]=c.checked?1:0; saveInd(); drawChart(); });
  m.querySelector("#indreset").onclick=()=>{ IND={...IND_DEF}; saveInd(); renderIndMenu(); drawChart(); };
}
function drawChart(){
  const el=document.getElementById("chart");
  if(!el)return;
  let pts=sliced();
  const loadingKey=range+"|"+interval;
  const msg=document.getElementById("chartmsg");
  if(pts.length<2){
    if(LWC) clearSeries();
    if(msg){ msg.style.display=""; msg.textContent=BARS[loadingKey]==="loading"?"Fetching "+INTERVALS[interval].label+"…":"No "+INTERVALS[interval].label+" for this range on the free feed right now."; }
    const lbl0=document.getElementById("chartret"); if(lbl0) lbl0.innerHTML=""; return; }
  if(msg) msg.style.display="none";
  const intra=isIntra(interval);
  const quarterly=!intra&&pts.length>1&&(Date.parse(pts[1].date)-Date.parse(pts[0].date)>45*864e5);
  let barNote=quarterly?"quarterly bars (the free record before ten years back)":INTERVALS[interval].label;
  const S=seriesFor(pts,intra);
  const chart=ensureChart(); clearSeries();
  document.getElementById("chart").style.height=chartHeight()+"px";
  // one row per time, ascending: the feed can repeat a stamp at a session's edge
  const rows=[]; const seen=new Set();
  for(let i=0;i<pts.length;i++){ const t=toTime(pts[i].date); if(seen.has(t)) continue; seen.add(t); rows.push({t,p:pts[i],s:S[i]}); }
  LDATA={pts:rows.map(r=>r.p),S:rows.map(r=>r.s),times:rows.map(r=>r.t)};
  const vals=LDATA.S.map(s=>s.v);
  const lastV=vals[vals.length-1];
  const up = mode!=="drawdown" ? lastV>=vals[0] : lastV>=-0.001;
  const pos=tok("--pos"), neg=tok("--neg"), col = mode==="drawdown" ? neg : (up?pos:neg);
  const hasOHLC=!LDATA.pts.some(p=>p.o==null);
  const useCandles = (mode==="candles"||mode==="bars"||mode==="ha") && hasOHLC;
  const pf={type:"price",precision:mode==="drawdown"?1:(lastV<10?3:2),minMove:mode==="drawdown"?0.1:(lastV<10?0.001:0.01)};
  let main;
  if(mode==="drawdown"){
    main=chart.addSeries(LightweightCharts.BaselineSeries,{baseValue:{type:"price",price:0},topLineColor:pos,topFillColor1:"rgba(0,0,0,0)",topFillColor2:"rgba(0,0,0,0)",bottomLineColor:neg,bottomFillColor1:neg+"0a",bottomFillColor2:neg+"2e",lineWidth:2,priceFormat:{type:"custom",formatter:v=>v.toFixed(1)+"%",minMove:0.1},priceLineVisible:true,lastValueVisible:true});
    main.setData(rows.map(r=>({time:r.t,value:+r.s.v.toFixed(2)})));
  }else if(useCandles){
    let ohlc=rows.map(r=>({time:r.t,open:r.p.o,high:r.p.h??Math.max(r.p.o,r.p.price),low:r.p.l??Math.min(r.p.o,r.p.price),close:r.p.price}));
    if(mode==="ha"){
      // Heikin Ashi: each bar averaged with the one before, so the trend reads and the noise does not
      const out=[]; for(let i=0;i<ohlc.length;i++){ const b=ohlc[i], prev=out[i-1]; const close=(b.open+b.high+b.low+b.close)/4; const open=prev?(prev.open+prev.close)/2:(b.open+b.close)/2;
        out.push({time:b.time,open,close,high:Math.max(b.high,open,close),low:Math.min(b.low,open,close)}); } ohlc=out;
    }
    main=chart.addSeries(mode==="bars"?LightweightCharts.BarSeries:LightweightCharts.CandlestickSeries,
      mode==="bars"?{upColor:pos,downColor:neg,thinBars:false,priceFormat:pf}:{upColor:pos,downColor:neg,borderUpColor:pos,borderDownColor:neg,wickUpColor:pos,wickDownColor:neg,priceFormat:pf});
    main.setData(ohlc);
  }else if(mode==="line"){
    main=chart.addSeries(LightweightCharts.LineSeries,{color:col,lineWidth:2,priceFormat:pf});
    main.setData(rows.map(r=>({time:r.t,value:r.s.v})));
  }else{
    main=chart.addSeries(LightweightCharts.AreaSeries,{lineColor:col,topColor:col+"33",bottomColor:col+"03",lineWidth:2,priceFormat:pf});
    main.setData(rows.map(r=>({time:r.t,value:r.s.v})));
  }
  LSERIES.push(main);
  let d0=0; for(let i=HIST.length-1;i>0;i--) if(Date.parse(HIST[i].date)-Date.parse(HIST[i-1].date)>45*864e5){d0=i;break;}
  const DAILY=HIST.slice(d0);
  // the log scale is the price pane's own; a study pane stays linear (a log of a negative MACD is nothing)
  main.priceScale().applyOptions({mode:IND.log&&mode!=="drawdown"?LightweightCharts.PriceScaleMode.Logarithmic:LightweightCharts.PriceScaleMode.Normal});
  let legend=renderIndicators(chart,rows,intra,quarterly,DAILY);
  for(const sr of LSERIES) if(sr!==main){ try{ if(chart.panes().length>1&&sr.getPane&&sr.getPane().paneIndex()>0) sr.priceScale().applyOptions({mode:LightweightCharts.PriceScaleMode.Normal}); }catch(e){} }
  // volume below the price, on its own scale within the price pane
  if(IND.vol && mode!=="drawdown" && LDATA.pts.some(p=>p.v)){
    const vs=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:"volume"},priceScaleId:"vol",priceLineVisible:false,lastValueVisible:false});
    chart.priceScale("vol").applyOptions({scaleMargins:{top:0.82,bottom:0}});
    vs.setData(rows.map(r=>({time:r.t,value:r.p.v||0,color:(r.p.o!=null?r.p.price>=r.p.o:true)?pos+"66":neg+"66"})));
    LSERIES.push(vs);
  }
  renderDrawings(chart,main);
  chart.timeScale().fitContent();
  const ret = mode!=="drawdown" ? (vals[vals.length-1]/vals[0]-1)*100 : null;
  const maxdd = mode!=="drawdown" ? null : Math.min(...vals);
  const lbl=document.getElementById("chartret");
  if(lbl) lbl.innerHTML = (mode!=="drawdown"
    ? `<span class="rangeret mono ${cls(ret)}">${pct(ret)}</span> <span class="dim">over ${range}${barNote?" · "+barNote:""}</span>`
    : `<span class="rangeret mono neg">${maxdd.toFixed(1)}%</span> <span class="dim">deepest in ${range} · % below the running peak of all loaded history</span>`)+legend;
}

  const iseg=document.getElementById("intseg");

  const bare=(FINSYM||SYM).replace(/\.[A-Z]{1,3}$/,"").replace(/-/g,".");   // HDFCBANK.NS -> HDFCBANK, BRK-B -> BRK.B

function mountTV(){
  const wrap=document.getElementById("tvwrap"); if(!wrap) return;
  wrap.innerHTML=`<div class="tradingview-widget-container" style="height:100%"><div id="tvchart" style="height:calc(100% - 22px)"></div></div>`;
  const sc=document.createElement("script");
  sc.type="text/javascript"; sc.async=true;
  sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  sc.text=JSON.stringify({autosize:true,symbol:tvSymbol(),interval:"D",timezone:"Etc/UTC",theme:"dark",style:"1",locale:"en",
    allow_symbol_change:false,hide_side_toolbar:false,withdateranges:true,calendar:false,save_image:true,support_host:"https://www.tradingview.com"});
  wrap.firstChild.appendChild(sc);
  // Their frame tells the page how it went: "tv-widget-no-data" when their embed does not carry
  // the name, "quoteUpdate" once their data is flowing. No word within twelve seconds means their
  // data did not reach this browser (a shield or ad blocker, or no network): the desk's chart takes over.
  TVSTATE.got=""; TVSTATE.mounted=Date.now();
  setTimeout(()=>{ if(chartSource()==="tv"&&!TVSTATE.got&&document.getElementById("tvwrap").style.display!=="none"){ setChartSource("desk",true,false,wrap.querySelector("iframe")?"nodata":"noframe"); } },12000);
}
const TVSTATE={got:"",mounted:0};
window.addEventListener("message",e=>{
  if(!/tradingview/.test(e.origin)) return;
  let d=e.data; if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(x){ d={name:d.includes("tv-widget-no-data")?"tv-widget-no-data":""}; } }
  const name=d&&typeof d==="object"?d.name:"";
  if(name==="quoteUpdate"){
    TVSTATE.got="data";
    // their quote names the feed it comes from: BSE_EOD is end of day, EURONEXT_DLY is delayed, BATS_DLY is Cboe One delayed
    const on=String((d.data||{}).original_name||""), how=/_EOD:/.test(on)?"end-of-day bars, updated after the close":/_DLY:/.test(on)?"delayed":"";
    const note=document.getElementById("srcnote");
    if(note&&how&&document.getElementById("tvwrap").style.display!=="none") note.textContent="TradingView · "+tvSymbol()+" · "+how;
  }
  else if(name==="tv-widget-no-data"&&document.getElementById("tvwrap").style.display!=="none"){ TVSTATE.got="refused"; setChartSource("desk",true,false,"refused"); }
});
function setChartSource(src,fallback,quiet,why){   // quiet: the page opening on its default, nothing is remembered; why: what their frame said
  try{ if(!fallback&&!quiet) localStorage.setItem("gs.chart",src); }catch(e){}
  const tv=src==="tv";
  document.getElementById("tvwrap").style.display=tv?"":"none";
  for(const id of ["modeseg","indwrap","rangeseg","intseg","chart","tip","chartret","drawbar"]){ const el=document.getElementById(id); if(el) el.style.display=tv?"none":""; }
  document.querySelectorAll("#srcseg button").forEach(b=>b.classList.toggle("on",b.dataset.s===(fallback?"desk":src)));
  const note=document.getElementById("srcnote");
  const FELL={refused:"TradingView does not carry "+tvSymbol()+"; the desk's chart instead.",
    nodata:"TradingView's data did not reach this browser; the desk's chart instead.",
    noframe:"TradingView did not load here; the desk's chart instead."};
  if(note) note.textContent=fallback?(FELL[why]||FELL.noframe):tv?"TradingView · "+tvSymbol():"";
  const sb=document.getElementById("snapbtn"); if(sb) sb.title=tv?"TradingView's chart lives in their frame: press the camera on their toolbar, Copy image, then paste on this page; it becomes a clipping in your notes on this name":"A picture of this chart, as drawn, becomes a clipping in your notes on this name";
  if(tv){ if(!document.querySelector("#tvwrap iframe")) mountTV(); } else drawChart();
}

/* Drawings on the desk's chart: a level (one click), a trendline (two clicks), a note on a bar
   (a click and a few words). Kept per listing in the vault (charts/<SYM>.json), drawn again on
   every visit and every range, and part of the picture Save chart to notes keeps. The reader
   draws; nothing is written until then; every drawing has its × in the strip under the chart. */
let DRAW={tool:"",items:[],pending:null,main:null,extra:[]};
const tStr=t=>typeof t==="number"?new Date(t*1000).toISOString().slice(0,16).replace("T"," "):String(t);
// a point drawn on daily bars has a day; one drawn on intraday bars has the minute too. On the
// other kind of bar it is placed at the day (daily) or left out (intraday, no minute to put it on)
function drawTime(t){ const intra=isIntra(interval); if(intra) return t.length>=16?toTime(t):null; return t.slice(0,10); }
async function loadDrawings(){
  try{ const d=await (await fetch("/api/research/drawings?symbol="+encodeURIComponent(SYM))).json(); DRAW.items=d.items||[]; }catch(e){ DRAW.items=[]; }
  renderDrawBar(); if(LWC&&LDATA.pts.length) drawChart();
}
function renderDrawings(chart,main){
  DRAW.main=main;
  const pos=tok("--pos"), acc=tok("--accent"), ink=tok("--ink2");
  const marks=[];
  for(const it of DRAW.items){
    if(it.kind==="level"&&mode!=="drawdown"){
      main.createPriceLine({price:it.price,color:acc,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:it.text||""});
    }else if(it.kind==="trend"&&mode!=="drawdown"){
      const a=drawTime(it.a.t), b=drawTime(it.b.t); if(a==null||b==null||a===b) continue;
      const ls=chart.addSeries(LightweightCharts.LineSeries,{color:acc,lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,title:it.text||""});
      ls.setData([{time:a,value:it.a.p},{time:b,value:it.b.p}]); LSERIES.push(ls);
    }else if(it.kind==="note"){
      const t=drawTime(it.t); if(t==null) continue;
      // a note sits on the bar it was made on; a bar the range does not hold is left out
      if(!LDATA.times.includes(t)) continue;
      marks.push({time:t,position:"aboveBar",color:ink,shape:"arrowDown",text:it.text,size:1});
    }
  }
  if(marks.length){ marks.sort((x,y)=>(typeof x.time==="number"?x.time:Date.parse(x.time))-(typeof y.time==="number"?y.time:Date.parse(y.time))); LightweightCharts.createSeriesMarkers(main,marks); }
}
function drawLabel(it){
  if(it.kind==="level") return `level ${F(it.price)}${it.text?" · "+esc(it.text):""}`;
  if(it.kind==="trend") return `trend ${it.a.t.slice(0,10)} → ${it.b.t.slice(0,10)}${it.text?" · "+esc(it.text):""}`;
  return `note ${it.t.slice(0,10)} · ${esc(it.text)}`;
}
function renderDrawBar(){
  const bar=document.getElementById("drawbar"); if(!bar) return;
  const tools=[["","Pointer"],["level","Level"],["trend","Trendline"],["note","Note on a bar"]];
  bar.innerHTML=`<span class="dim" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.12em">Draw</span>
    <div class="seg" id="toolseg">${tools.map(([k,l])=>`<button data-t="${k}" class="${DRAW.tool===k?"on":""}">${l}</button>`).join("")}</div>
    <span id="drawhint" class="dim" style="font-size:11px"></span>
    <span style="flex:1"></span>
    ${DRAW.items.map(it=>`<span class="dchip" data-id="${it.id}">${drawLabel(it)}<button title="Remove" data-x="${it.id}">✕</button></span>`).join("")}
    ${DRAW.items.length>1?`<button class="fsbtn" id="drawclear" style="padding:2px 8px;font-size:11px">Clear all</button>`:""}`;
  bar.querySelectorAll("#toolseg button").forEach(b=>b.onclick=()=>{ DRAW.tool=b.dataset.t; DRAW.pending=null; renderDrawBar(); });
  bar.querySelectorAll("button[data-x]").forEach(b=>b.onclick=()=>removeDrawing(b.dataset.x));
  const cl=bar.querySelector("#drawclear"); if(cl) cl.onclick=()=>removeDrawing("");
  const el=document.getElementById("chart"); if(el) el.style.cursor=DRAW.tool?"crosshair":"";
  drawHint(DRAW.tool==="level"?"Click the chart at the price.":DRAW.tool==="trend"?(DRAW.pending?"Now the second bar.":"Click the first bar, then the second."):DRAW.tool==="note"?"Click the bar the note is about.":"");
}
function drawHint(t){ const h=document.getElementById("drawhint"); if(h) h.textContent=t||""; }
async function addDrawing(item){
  let r; try{ r=await (await fetch("/api/research/drawings/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:SYM,item})})).json(); }catch(e){ r={ok:false,error:"the desk did not answer"}; }
  if(!r.ok){ drawHint(r.error||"could not save the drawing"); return; }
  DRAW.items=r.items||[]; DRAW.pending=null; renderDrawBar(); drawChart();
}
async function removeDrawing(id){
  let r; try{ r=await (await fetch("/api/research/drawings/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:SYM,id})})).json(); }catch(e){ return; }
  if(r.ok){ DRAW.items=r.items||[]; renderDrawBar(); drawChart(); }
}
function bindDrawClicks(chart){
  chart.subscribeClick(param=>{
    if(!DRAW.tool||!param.point||!DRAW.main||mode==="drawdown") return;
    const price=DRAW.main.coordinateToPrice(param.point.y); if(price==null) return;
    const p=+price.toFixed(price<10?4:2);
    if(DRAW.tool==="level"){ addDrawing({kind:"level",price:p}); return; }
    if(!param.time){ drawHint("Click on a bar."); return; }
    const t=tStr(param.time);
    if(DRAW.tool==="trend"){
      if(!DRAW.pending){ DRAW.pending={t,p}; drawHint(`First point ${t.slice(0,10)} at ${F(p)}; now the second bar.`); return; }
      addDrawing({kind:"trend",a:DRAW.pending,b:{t,p}}); return;
    }
    // a note on a bar: the words are asked for in the strip, in place
    const bar=document.getElementById("drawbar");
    bar.innerHTML=`<span class="dim" style="font-size:11px">Note on ${esc(t.slice(0,10))} at ${F(p)}:</span> <input id="drawtext" maxlength="120" placeholder="a few words" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font:inherit;font-size:11.5px;width:280px"> <button class="fsbtn" id="drawok" style="padding:3px 9px;font-size:11px">Save</button> <button class="fsbtn" id="drawno" style="padding:3px 9px;font-size:11px">Cancel</button>`;
    const inp=bar.querySelector("#drawtext"); inp.focus();
    const go=()=>{ const text=inp.value.trim(); if(!text) return inp.focus(); addDrawing({kind:"note",at:{t,p},text}); };
    bar.querySelector("#drawok").onclick=go; bar.querySelector("#drawno").onclick=renderDrawBar;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); if(e.key==="Escape") renderDrawBar(); });
  });
}
function bindChart(){
  renderRangeSeg();
  document.querySelectorAll("#srcseg button").forEach(b=>b.onclick=()=>setChartSource(b.dataset.s));
  document.getElementById("rangeseg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    range=b.dataset.r;
    if(!ALLOWED[range].includes(interval)) interval=DEFAULT_INT[range];   // the size stays while it fits
    renderRangeSeg(); drawChart();});
  document.getElementById("intseg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    interval=b.dataset.i; renderRangeSeg(); drawChart();});
  document.querySelectorAll("#modeseg button").forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;
    document.querySelectorAll("#modeseg button").forEach(x=>x.classList.toggle("on",x===b));
    drawChart();});
  document.getElementById("fsbtn").onclick=toggleFS;
  renderIndMenu();
  document.getElementById("indbtn").onclick=e=>{ e.stopPropagation(); const m=document.getElementById("indmenu"); m.style.display=m.style.display==="none"?"":"none"; };
  document.addEventListener("click",e=>{ const m=document.getElementById("indmenu"); if(m&&m.style.display!=="none"&&!e.target.closest("#indwrap")) m.style.display="none"; });
  document.getElementById("snapbtn").onclick=snapChart;
  window.addEventListener("resize",()=>{ if(LWC) LWC.applyOptions({height:chartHeight()}); });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&isFS)toggleFS();});
  setChartSource(chartSource(),false,true);
}
/* Save chart to notes: the chart as drawn becomes a clipping note on this name, filed under the
   calendar quarter of the day, so it sits on the timeline next to the quarter's other notes and
   the Ask box can read it later. The desk's own chart is drawn straight to a picture. TradingView's
   chart lives in their frame, which the page cannot read, so their own camera makes the picture
   (Copy image) and a paste on this page brings it in with the reader's drawings and studies. */
function snapSay(html){ const m=document.getElementById("snapmsg"); if(!m) return; m.innerHTML=html; m.style.display=html?"":"none"; }
function chartWords(){ return ((document.getElementById("chartret")||{}).innerText||range).replace(/\s*—\s*/g," · ").replace(/\s+/g," ").trim(); }   // "+40.2% over 1Y · daily bars · MA50 · MA200"
function calQuarter(d){ return "Q"+(Math.floor(d.getMonth()/3)+1)+" "+d.getFullYear(); }
function stamp(d){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
async function deskChartPNG(){
  if(!LWC||!LDATA.pts.length) return null;
  const shot=LWC.takeScreenshot();       // the chart as drawn, at the screen's own pixel density
  const cs=getComputedStyle(document.documentElement), k=window.devicePixelRatio||1, cap=22;
  const w=shot.width/k, h=shot.height/k;
  const c=document.createElement("canvas"); c.width=shot.width; c.height=shot.height+cap*k;
  const g=c.getContext("2d"); g.scale(k,k);
  g.fillStyle=cs.getPropertyValue("--panel").trim()||"#111"; g.fillRect(0,0,w,h+cap);
  g.fillStyle=cs.getPropertyValue("--ink2").trim()||"#ccc"; g.font="600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif";
  g.fillText(`${SYM} · ${range} · ${chartWords()} · ${stamp(new Date())}`,10,15);
  g.drawImage(shot,0,0,shot.width,shot.height,0,cap,w,h);
  return new Promise(ok=>c.toBlob(ok,"image/png"));
}
async function saveClipping(blob,how){
  const now=new Date(), day=stamp(now).slice(0,10);
  snapSay("Saving the chart to your notes…");
  let up; try{ up=await (await fetch("/api/research/upload?"+new URLSearchParams({name:`${SYM}-chart-${day}.png`,symbol:SYM}),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:blob})).json(); }catch(e){ up={ok:false,error:"the desk did not answer"}; }
  if(!up.ok) return snapSay("The picture did not go in: "+esc(up.error||"unknown"));
  const body=how==="tv"?`TradingView's chart of ${tvSymbol()} as drawn on ${stamp(now)}, with the drawings and studies it carried.`:`The desk's own chart on ${stamp(now)}: ${chartWords()}.`;
  let r; try{ r=await (await fetch("/api/notes/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:`${SYM} chart · ${day}`,type:"clipping",kind:"stock",symbols:[SYM],period:calQuarter(now),file:up.file,body})})).json(); }catch(e){ r={ok:false,error:"the desk did not answer"}; }
  if(!r.ok) return snapSay("The note did not save: "+esc(r.error||"unknown"));
  snapSay(`Saved to your notes on ${esc(SYM)}, filed under ${esc(calQuarter(now))}: <a href="/notes?id=${encodeURIComponent(r.note.id)}" style="color:var(--accent)">${esc(r.note.title)}</a> <button class="fsbtn" id="snapundo" style="margin-left:10px;padding:2px 8px;font-size:11px">Undo</button>`);
  document.getElementById("snapundo").onclick=async()=>{ await fetch("/api/notes/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:r.note.id,with_file:true})}); snapSay(""); loadNotes(); };
  if(window.deskJournal&&r.journal) deskJournal(r.journal);
  loadNotes();
}
async function snapChart(){
  const tv=document.getElementById("tvwrap").style.display!=="none";
  if(!tv){ const b=await deskChartPNG().catch(()=>null); if(!b) return snapSay("There is no chart drawn to save yet."); return saveClipping(b,"desk"); }
  snapSay("On TradingView's toolbar press the camera, choose <b>Copy image</b>, then press <b>"+(navigator.platform.startsWith("Mac")?"⌘V":"Ctrl+V")+"</b> on this page. The picture, with your drawings and studies, lands in your notes on "+esc(SYM)+". <button class=\"fsbtn\" id=\"snapno\" style=\"margin-left:10px;padding:2px 8px;font-size:11px\">Close</button>");
  document.getElementById("snapno").onclick=()=>snapSay("");
}
document.addEventListener("paste",e=>{
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName)) return;   // text pasted into a box stays text
  const it=[...(e.clipboardData||{}).items||[]].find(x=>x.type.startsWith("image/")); if(!it) return;
  e.preventDefault(); const tv=document.getElementById("tvwrap")&&document.getElementById("tvwrap").style.display!=="none";
  saveClipping(it.getAsFile(),tv?"tv":"paste");
});
function toggleFS(){
  isFS=!isFS;
  document.getElementById("chartpanel").classList.toggle("fs",isFS);
  document.body.style.overflow=isFS?"hidden":"";
  document.getElementById("fsbtn").textContent=isFS?"✕ Close":"⛶ Full screen";
  const tv=document.getElementById("tvwrap"); if(tv) tv.style.height=isFS?"calc(100vh - 90px)":"480px";
  const box=document.getElementById("chart"); if(box) box.style.height=chartHeight()+"px";
  if(chartSource()!=="tv"||document.getElementById("srcnote").textContent.startsWith("TradingView's chart could not")) drawChart();
}

function rangeBar(cap,lo,hi,px,loD,hiD){
  if(lo==null||hi==null||hi<=lo)return "";
  const posn=Math.min(100,Math.max(0,(px-lo)/(hi-lo)*100));
  return `<div class="range"><div class="cap">${cap}</div>
    <div class="track"><span class="mark" style="left:calc(${posn.toFixed(1)}% - 6px)"></span></div>
    <div class="lbl"><span>${F(lo)}${loD?" · "+loD:""}</span><span>${F(hi)}${hiD?" · "+hiD:""}</span></div></div>`;
}
function st(l,v,k){return `<div class="st"><div class="l">${l}</div><div class="v mono ${k||""}">${v}</div></div>`;}

/* ================= LOADERS ================= */
async function load(){
  const r=await fetch("/api/ticker?symbol="+SYM+"&region="+REG);
  const d=await r.json();
  const app=document.getElementById("app");
  loadNotes();   // your notes on the name show even when the quote does not
  loadDrawings();   // and your drawings on its chart
  if(d.error){app.innerHTML=`<div class="loading">${esc(d.error)}</div>`;return;}
  // the feed is resting: the page is the last full read, and says when it was taken
  if(d.stale_since){
    const bar=document.createElement("div"); bar.className="stalebar";
    bar.textContent=`The free feed is resting, so this is the page as read at ${d.stale_since}. It refreshes on its own once the feed answers again.`;
    app.parentNode.insertBefore(bar,app);
  }
  // the free feed matched the name to its exchange symbol: the page is that symbol's
  if(d.matched_from&&(HOME||d.symbol!==SYM)){ location.replace("/t?symbol="+encodeURIComponent(d.symbol)+"&from="+encodeURIComponent(d.matched_from)); return; }
  document.title=SYM+" · GreekSoup";
  HIST=[...(d.history||[])].reverse();
  INTRA=d.intraday||{};
  if(HOME) renderHome(d,app); else renderUS(d,app);
  bindChart();
}

function renderHome(d,app){

  // position cards — labelled by account number; futures detected by shape
  let posCards="";
  for(const [k,h] of Object.entries(d.held_in||{})){
    const isFut = ("expiry" in h) && ("side" in h);
    if(isFut){
      const sign=(h.side||"Buy").toLowerCase()==="buy"?1:-1;
      const pnl=(h.ltp!=null&&h.avg!=null&&h.qty!=null)?(h.ltp-h.avg)*h.qty*sign:null;
      posCards+=`<section class="panel poscard"><div class="panel-h"><h2>${k}</h2><span class="s">${h.expiry||""}</span></div>
        <div class="panel-b">
        <div class="an-row"><span class="k">${h.side} qty</span><span class="mono">${F(h.qty,0)}</span></div>
        <div class="an-row"><span class="k">Avg</span><span class="mono">${money(h.avg)}</span></div>
        <div class="an-row"><span class="k">Mark</span><span class="mono">${money(h.ltp)}</span></div>
        <div class="an-row"><span class="k">MTM</span><span class="mono ${cls(pnl)}">${pnl==null?"—":(pnl>=0?"+":"")+money(pnl,0)}</span></div>
        </div></section>`;
    }else{
      const val=px*h.qty, cost=h.avg*h.qty, pnl=val-cost;
      posCards+=`<section class="panel poscard"><div class="panel-h"><h2>Held · ${k}</h2></div>
        <div class="panel-b">
        <div class="an-row"><span class="k">Qty</span><span class="mono">${F(h.qty,0)}</span></div>
        <div class="an-row"><span class="k">Avg cost</span><span class="mono">${money(h.avg)}</span></div>
        <div class="an-row"><span class="k">Value</span><span class="mono">${money(val,0)}</span></div>
        <div class="an-row"><span class="k">Open P&L</span><span class="mono ${cls(pnl)}">${(pnl>=0?"+":"")+money(pnl,0)} (${pct(pnl/cost*100)})</span></div>
        </div></section>`;
    }
  }
  // futures book: live bid/ask/OI on the contract itself
  let futBook="";
  for(const fq of (d.futures_quotes||[])){
    futBook+=`<section class="panel"><div class="panel-h"><h2>Futures book</h2><span class="s">${fq.expiry}</span></div>
      <div class="panel-b">
      <div class="an-row"><span class="k">LTP</span><span class="mono" style="font-weight:700">${money(fq.ltp)}</span></div>
      <div class="an-row"><span class="k">Bid</span><span class="mono">${money(fq.bid)} × ${F(fq.bid_qty,0)}</span></div>
      <div class="an-row"><span class="k">Ask</span><span class="mono">${money(fq.offer)} × ${F(fq.offer_qty,0)}</span></div>
      <div class="an-row"><span class="k">Open interest</span><span class="mono">${F(fq.oi,0)}</span></div>
      <div class="an-row"><span class="k">Volume</span><span class="mono">${F(fq.ttq,0)}</span></div>
      <div class="an-row"><span class="k">Prev close</span><span class="mono">${money(fq.prev)}</span></div>
      </div></section>`;
  }
  posCards += futBook;
  const hasBook = d.has_book || q.bid!=null;
  const filings = d.filings||"";
  const w52l = m.w52l ?? q.ylow, w52h = m.w52h ?? q.yhigh;
  const hasRange = (w52l!=null && w52h!=null) || (m.ltl!=null && m.lth!=null);
  app.innerHTML=`
  <div class="hero">
    <span class="sym">${SYM}</span><span class="co">${m.company||q.name||""}</span>
    <span class="badge">${q.exch||m.exch||""}</span>
    ${d.exchange_symbol?`<span class="badge">${d.exchange_symbol}</span>`:""}
    <span style="flex:1"></span>
    <span class="px mono">${money(px)}</span>
    <span class="chg mono ${cls(q.day_pct)}">${pct(q.day_pct)}</span>
  </div>
  <div class="sub">${m.isin?"ISIN "+m.isin+" · ":""}${hasBook?`bid ${money(q.bid)} × ${F(q.bid_qty,0)} · offer ${money(q.offer)} × ${F(q.offer_qty,0)} · `:""}vol ${F(q.ttq,0)} · as of ${d.ts}${hasBook?"":" · Yahoo's free feed, delayed on most exchanges"}</div>
  <div class="grid">
    <div>
      ${chartPanel()}
      <section class="panel">
        <div class="panel-h"><h2>Session</h2></div>
        <div class="stats">
          ${st("Open",money(q.open))}${st("High",money(q.high))}${st("Low",money(q.low))}
          ${st("Prev close",money(q.prev))}${st("Volume",F(q.ttq,0))}
          ${st("Day move",pct(q.day_pct),cls(q.day_pct))}
        </div>
      </section>
      ${filings?`<section class="panel"><div class="panel-h"><h2>Quarterly results</h2><span class="s">${filings}${d.units?" · "+d.units:""}</span></div>
        <div class="panel-b" id="if-q"><div class="desc">Loading filings…</div></div>
      </section>
      <section class="panel"><div class="panel-h"><h2>Corporate filings</h2><span class="s">last 90 days</span></div>
        <div class="panel-b" id="if-ann"><div class="desc">Loading…</div></div>
      </section>`:""}
      ${finPanelHTML()}
    </div>
    <div>
      ${posCards}
      ${hasRange?`<section class="panel">
        <div class="panel-h"><h2>Where it trades</h2><span class="s">range</span></div>
        <div class="panel-b">
          ${rangeBar("52-WEEK RANGE",w52l,w52h,px)}

        </div>
      </section>`:""}
      ${filings?`<section class="panel"><div class="panel-h"><h2>Shareholding</h2><span class="s">${d.market||""}</span></div>
        <div class="panel-b" id="if-sh"><div class="desc">Loading…</div></div>
      </section>`:""}
    </div>
  </div>`;
  if(filings) loadInfund(filings);
  loadFin();
}

async function loadInfund(filings){
  let d;
  try{ const r=await fetch("/api/infund?symbol="+encodeURIComponent(SYM)); d=await r.json(); }
  catch(e){ d={error:"fetch failed"}; }
  const qEl=document.getElementById("if-q"), aEl=document.getElementById("if-ann"), sEl=document.getElementById("if-sh");
  if(!qEl) return;
  if(d.error){
    qEl.innerHTML=aEl.innerHTML=sEl.innerHTML=`<div class="desc">${d.error}</div>`;
    return;
  }
  const qs=d.quarters||[];
  if(qs.length){
    const MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
    const flavor=qs[0].flavor||"", qlabel=s=>{
      const p=s.split("-"); const m=MON[(p[1]||"").toUpperCase()], y=+p[2];
      if(m==null||!y) return s;
      const q=m>=3?Math.floor((m-3)/3)+1:4, fy=(m>=3?y+1:y)%100;
      return "Q"+q+" FY"+fy;};
    qEl.innerHTML=`<table class="mini"><thead><tr><th>Quarter</th><th>Revenue</th><th>PBT</th><th>PAT</th><th>EPS</th></tr></thead><tbody>`+
      qs.map(x=>{
        const yoy=qs.find(o=>o!==x&&o.quarter_ended.slice(0,6)===x.quarter_ended.slice(0,6)&&+o.quarter_ended.slice(-4)===+x.quarter_ended.slice(-4)-1);
        const g=(yoy&&yoy.revenue&&x.revenue!=null)?((x.revenue-yoy.revenue)/Math.abs(yoy.revenue)*100):null;
        return `<tr><td>${qlabel(x.quarter_ended)}<span class="s"> ${x.quarter_ended}</span></td>
          <td class="mono">${x.revenue==null?"—":F(x.revenue,0)}${g==null?"":` <span class="${g>=0?"pos":"neg"}" style="font-size:10px">${pct(g)}</span>`}</td>
          <td class="mono ${cls(x.pbt)}">${x.pbt==null?"—":F(x.pbt,0)}</td>
          <td class="mono ${cls(x.pat)}">${x.pat==null?"—":F(x.pat,0)}</td>
          <td class="mono ${cls(x.eps)}">${x.eps==null?"—":x.eps}</td></tr>`;}).join("")+
      `</tbody></table><div class="desc" style="margin-top:6px">${flavor}, as filed (${filings}; revenue % is YoY same quarter, when in range). Rounding read from each filing.</div>`;
  }else qEl.innerHTML=`<div class="desc">No filings found for this name in the exchange's feed.</div>`;
  const sh=d.shareholding||[];
  sEl.innerHTML = sh.length
    ? `<table class="mini"><thead><tr><th>As of</th><th>Promoter</th><th>Public</th></tr></thead><tbody>`+
      sh.map(x=>`<tr><td>${x.date}</td><td class="mono">${x.promoter==null?"—":x.promoter.toFixed(2)+"%"}</td><td class="mono">${x.public==null?"—":x.public.toFixed(2)+"%"}</td></tr>`).join("")+
      `</tbody></table>`
    : `<div class="desc">No shareholding data.</div>`;
  const ann=d.announcements||[];
  aEl.innerHTML = ann.length
    ? ann.map(x=>`<div class="an-row" style="align-items:baseline;gap:10px">
        <span class="s mono" style="white-space:nowrap">${x.date}</span>
        <span style="flex:1;font-size:12px">${x.pdf?`<a href="${x.pdf}" target="_blank" style="color:var(--ink);text-decoration:none">${x.desc||"Filing"}</a>`:(x.desc||"Filing")}
          <span class="s"> · ${x.text||""}</span></span></div>`).join("")
    : `<div class="desc">No filings in the last 90 days.</div>`;
}

// ---- DCF workspace (client-side, seeded from actuals) ----
let DCFA=null;
function dcfSeeds(){
  const inc=(FIN.inc_a||[]).slice().reverse(), cf=(FIN.cf_a||[]).slice().reverse(),
        bs=(FIN.bs_a||[]).slice().reverse();
  const li=inc[inc.length-1]||{}, lc=cf[cf.length-1]||{}, lb=bs[bs.length-1]||{};
  const clamp=(v,a,b,d)=>(v==null||isNaN(v))?d:Math.min(b,Math.max(a,v));
  let cagr=8;
  // seed off the last ~3 growth intervals so a distressed base year (e.g. a
  // COVID-era FY) does not inflate the default into fantasy
  const win=inc.slice(-4);
  if(win.length>=2&&win[0].revenue>0)
    cagr=(Math.pow(li.revenue/win[0].revenue,1/(win.length-1))-1)*100;
  return {
    g: clamp(Math.round(cagr),-5,30,8),
    em: clamp(Math.round(li.revenue?li.ebitda/li.revenue*100:20),1,70,20),
    da: clamp(Math.round(li.revenue?li.depreciationAndAmortization/li.revenue*100:4),0,25,4),
    cx: clamp(Math.round(li.revenue?Math.abs(lc.capitalExpenditure||0)/li.revenue*100:4),0,30,4),
    tax: clamp(Math.round(li.incomeBeforeTax>0?li.incomeTaxExpense/li.incomeBeforeTax*100:21),5,40,21),
    wacc: 9, tg: 2.5,
    rev0: li.revenue||0, netDebt: lb.netDebt??((lb.totalDebt||0)-(lb.cashAndCashEquivalents||0)),
    shares: li.weightedAverageShsOutDil||li.weightedAverageShsOut||null, fy: li.fiscalYear
  };
}
function dcfCompute(){
  const a=DCFA; if(!a||!a.rev0||!a.shares) return null;
  if(a.wacc<=a.tg+0.5) return {err:"Discount rate must sit above terminal growth."};
  let rev=a.rev0, pv=0, fcfN=0;
  for(let t=1;t<=5;t++){
    rev*=(1+a.g/100);
    const ebitda=rev*a.em/100, da=rev*a.da/100, ebit=ebitda-da;
    const nopat=ebit*(1-a.tax/100), fcf=nopat+da-rev*a.cx/100;
    pv+=fcf/Math.pow(1+a.wacc/100,t);
    if(t===5) fcfN=fcf;
  }
  const tv=fcfN*(1+a.tg/100)/((a.wacc-a.tg)/100), tvPV=tv/Math.pow(1+a.wacc/100,5);
  const ev=pv+tvPV, eq=ev-(a.netDebt||0), ps=eq/a.shares;
  return {ev,eq,ps,tvShare:ev?tvPV/ev*100:null};
}
function dcfSlider(k,label,hint,min,max,step){
  return `<div class="dcf-as"><div class="l"><span>${label}</span><b id="dcfv-${k}" class="mono">${DCFA[k]}%</b></div>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${DCFA[k]}"
      oninput="DCFA.${k}=+this.value;document.getElementById('dcfv-${k}').textContent=this.value+'%';dcfOut()">
    <div class="hint">${hint}</div></div>`;
}
function dcfOut(){
  const el=document.getElementById("dcfout"); if(!el) return;
  const r=dcfCompute();
  if(!r){ el.innerHTML='<div class="fin-note">Not enough filed data to seed a model here.</div>'; return; }
  if(r.err){ el.innerHTML=`<div class="fin-note">${r.err}</div>`; return; }
  const up=FINPX?(r.ps-FINPX)/FINPX*100:null;
  el.innerHTML=`<div class="an-row"><span class="k">My fair value / share</span></div>
    <div class="big mono">${usd(r.ps)}</div>
    <div class="vs mono ${up==null?"":up>=0?"pos":"neg"}">${up==null?"":(up>=0?"+":"")+up.toFixed(1)+"% vs price "+usd(FINPX)}</div>
    <div class="an-row"><span class="k">Enterprise value</span><span class="mono">${big(r.ev)}</span></div>
    <div class="an-row"><span class="k">Less net debt</span><span class="mono">${big(DCFA.netDebt)}</span></div>
    <div class="an-row"><span class="k">Equity value</span><span class="mono">${big(r.eq)}</span></div>
    <div class="an-row"><span class="k">Terminal value share</span><span class="mono">${r.tvShare==null?"—":r.tvShare.toFixed(0)+"%"}</span></div>
    ${FIN.dcf&&FIN.dcf.dcf?`<div class="an-row"><span class="k">FMP's own DCF</span><span class="mono">${usd(FIN.dcf.dcf)}</span></div>`:""}`;
}
function finDcfHTML(){
  if(!DCFA) DCFA=dcfSeeds();
  setTimeout(dcfOut,0);
  return `<div class="panel-b"><div class="dcfgrid"><div>
    ${dcfSlider("g","Revenue growth / yr","Seeded from the filed years' actual growth path",-5,30,0.5)}
    ${dcfSlider("em","EBITDA margin","What each revenue dollar keeps before depreciation and interest",1,70,0.5)}
    ${dcfSlider("da","D&A, % of revenue","Wear and tear charged against profit",0,25,0.5)}
    ${dcfSlider("cx","Capex, % of revenue","Cash spent on plant and equipment each year",0,30,0.5)}
    ${dcfSlider("tax","Tax rate","Seeded from the company's last effective rate",5,40,1)}
    ${dcfSlider("wacc","Discount rate (WACC)","The return you demand for waiting and risk",5,15,0.25)}
    ${dcfSlider("tg","Terminal growth","Growth forever after year 5; keep it near GDP",0,4,0.25)}
    <button class="fsbtn" onclick="DCFA=null;renderFin()">Reset to filed numbers</button>
  </div><div class="dcfout" id="dcfout"></div></div>
  <div class="fin-note" style="padding:10px 0 0">A five-year FCFF sandbox seeded from ${FINCO}'s filed FY${DCFA.fy} numbers. It answers "what am I assuming at this price," never "what should anyone do." Working capital is left out for simplicity; check the cash flow tab for how much that omits.</div></div>`;
}
function renderFin(){
  const el=document.getElementById("finbody"); if(!el||!FIN) return;
  document.querySelectorAll("#fin-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===FS.mode));
  document.querySelectorAll("#fin-period button").forEach(b=>b.classList.toggle("on",b.dataset.p===FS.period));
  document.querySelectorAll("#fin-unit button").forEach(b=>b.classList.toggle("on",b.dataset.u===FS.unit));
  const cb=document.getElementById("fin-chgbtn"); if(cb) cb.classList.toggle("on",FS.chg);
  // the free record fills the three statements only: the other tabs go away, and the currency is the filer's
  if(FIN.free && !["inc","bs","cf"].includes(FS.mode)){
    const what={ratios:"Ratio history comes",seg:"Segments come",est:"Street estimates come",peers:"A peer set comes",div:"Dividend history comes",dcf:"The DCF workspace comes"}[FS.mode]||"This comes";
    el.innerHTML=`<div class="fin-note">${what} with a data provider (FMP, for one); the free record carries the three statements. <a href="/settings" style="color:var(--accent)">Settings</a>, under Data.</div>`; return;
  }
  if(FIN.error){
    // no provider: the tabs that cannot fill go away, and the note says where a provider is set
    if(FIN.no_provider) document.querySelectorAll("#fin-tabs,#fin-period,#fin-unit,#fin-chgbtn").forEach(x=>x.style.display="none");
    el.innerHTML=`<div class="fin-note">${esc(FIN.error)}${FIN.no_provider?` A provider is set on <a href="/settings" style="color:var(--accent)">Settings</a>, under Data.`:""}</div>`; return; }
  const m=FS.mode;
  el.innerHTML = m==="inc"||m==="bs"||m==="cf" ? finStmtHTML(m)
    : m==="ratios" ? finRatiosHTML()
    : m==="seg" ? finSegHTML()
    : m==="est" ? finEstHTML()
    : m==="peers" ? finPeersHTML()
    : m==="div" ? finDivHTML()
    : finDcfHTML();
}
load();
</script>
</body>
</html>
